# OpenBao in dev mode, as a secret store for the local cluster. It keeps its
# data in memory only. The root token is in the Secret openbao-root.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: aviary-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
    spec:
      automountServiceAccountToken: false
      containers:
        - name: openbao
          image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: openbao-root
                  key: token
            - name: BAO_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: http
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: aviary-data
spec:
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: http
      port: 8200
      targetPort: http
