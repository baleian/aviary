# Grafana for the local cluster, installed by `make grafana`, which keeps the
# dashboards of deploy/grafana in the ConfigMap grafana-dashboards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  namespace: monitoring
data:
  # Signs everyone in as an administrator, without a password. Fine for the
  # local cluster, which only this machine reaches.
  grafana.ini: |
    [auth]
    disable_login_form = true
    [auth.anonymous]
    enabled = true
    org_role = Admin
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/aviary/aviary.json
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          # The scrape interval, from which $__rate_interval is derived.
          timeInterval: 15s
      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: aviary
        type: file
        options:
          path: /var/lib/grafana/dashboards/aviary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.3.1-distroless@sha256:54e297ac67e2b72572f926892f4e06074dc4f79f2a56ed9a9ca9a88a46f28733
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/aviary
      volumes:
        - name: config
          configMap:
            name: grafana
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  # The node port that hack/kind/cluster.yaml maps to localhost:3000.
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30300
