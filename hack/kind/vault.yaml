# Vault in dev mode, as a secret store for the local cluster. It keeps its
# data in memory only. The root token is in the Secret vault-root.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: aviary-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      automountServiceAccountToken: false
      containers:
        - name: vault
          image: hashicorp/vault:2.2.2@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-root
                  key: token
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: 0.0.0.0:8200
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: aviary-data
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: http
      port: 8200
      targetPort: http
