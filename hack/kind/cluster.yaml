kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # The Aviary API at localhost:8080, and Headlamp and Grafana, which make
    # headlamp and make grafana install, at localhost:4466 and localhost:3000.
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8080, listenAddress: 127.0.0.1}
      - {containerPort: 30466, hostPort: 4466, listenAddress: 127.0.0.1}
      - {containerPort: 30300, hostPort: 3000, listenAddress: 127.0.0.1}
  - role: worker
  - role: worker
