# The registry of the local cluster, which holds the harness images. Substrate
# pulls the image of a sandbox itself, by its digest, and on kind takes
# localhost:5001 for this registry: it pulls such an image from
# kind-registry:5000 over HTTP. The Service is in the namespace of Substrate,
# where that name resolves. make images puts the images in from a node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kind-registry
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kind-registry
  template:
    metadata:
      labels:
        app: kind-registry
    spec:
      containers:
        - name: registry
          image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
---
apiVersion: v1
kind: Service
metadata:
  name: kind-registry
  namespace: ate-system
spec:
  selector:
    app: kind-registry
  ports:
    - port: 5000
      targetPort: registry
---
# The namespace of Substrate takes no connection that a policy does not let
# in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kind-registry
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: kind-registry
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - {protocol: TCP, port: 5000}
