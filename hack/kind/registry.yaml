# The registry of the local cluster, which `make cluster-up` installs. The
# templates of sandboxes are built from the images in it, where `make images`
# puts the images of the harnesses. It keeps them only as long as its pod
# lives: `make images` puts them there again.
#
# The builder of templates takes an image over HTTPS only, so the registry has
# a certificate, in the secret registry-tls. The builder trusts it because
# `make cluster-up` builds the builder's image again with the certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: aviary-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
          env:
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /etc/registry/tls/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /etc/registry/tls/tls.key
          ports:
            - name: https
              containerPort: 5000
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /v2/
              port: https
          volumeMounts:
            - name: tls
              mountPath: /etc/registry/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: registry-tls
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: aviary-data
spec:
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: https
      port: 443
      targetPort: https
