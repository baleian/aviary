# The object store of the local cluster, which `make cluster-up` installs. It
# is RustFS, which speaks the API of S3, and it keeps what the sandboxes are
# made from. Its keys are in the secret rustfs-keys, and its bucket is
# sandboxes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: aviary-data
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-keys
                  key: access
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-keys
                  key: secret
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: s3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: aviary-data
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
# Makes the bucket, and makes nothing when the store has it.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket
  namespace: aviary-data
spec:
  backoffLimit: 20
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: bucket
          image: rustfs/rc:v0.1.38@sha256:3c080aff53f0d3b06554fd08711d05c80be40bd7e56001874d7df5e18d5ec88a
          args: ["mb", "--ignore-existing", "store/sandboxes"]
          env:
            - name: ACCESS
              valueFrom:
                secretKeyRef:
                  name: rustfs-keys
                  key: access
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: rustfs-keys
                  key: secret
            - name: RC_HOST_store
              value: http://$(ACCESS):$(SECRET)@rustfs:9000
