# MySQL for the local cluster, installed by `make cluster-up DATABASE=mysql`.
# The passwords are in the Secret mysql-users.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: aviary-data
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-users
                  key: root
            - name: MYSQL_DATABASE
              value: aviary
            - name: MYSQL_USER
              value: aviary
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-users
                  key: aviary
          ports:
            - name: mysql
              containerPort: 3306
          # During initialization the server listens only on its Unix
          # socket, and then restarts.
          readinessProbe:
            tcpSocket:
              port: mysql
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: aviary-data
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
