# Prometheus for the local cluster, installed by `make grafana`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# Lets Prometheus find the pods that it scrapes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: monitoring
data:
  # Scrapes only the Supervisors, the state metrics and the depots, and the
  # components of Agent Substrate, and keeps only the metrics that
  # deploy/grafana/aviary.json and deploy/grafana/substrate.json chart.
  # Prometheus reads the file when it starts.
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # The API server, atelet, the router, the egress gateway and the
      # controller, at their ports of metrics. The proxies of the router and
      # of the gateway have their own, of other metrics.
      - job_name: substrate
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [ate-system]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: prometheus|metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed
            action: drop
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: component
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "\
              (ate|atelet|atenet|rpc)_.+|\
              process_(cpu_seconds_total|resident_memory_bytes)|go_goroutines"
            action: keep
      - job_name: aviary-supervisor
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [aviary-system]}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
              - __meta_kubernetes_pod_container_port_name
            regex: aviary;supervisor;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed
            action: drop
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "\
              aviary_turns_(followed|ended_total)|aviary_turn_tokens_total|aviary_messages_refused_total|\
              aviary_turn_queue_length_(bucket|count)|aviary_turn_(queue|startup|run)_duration_seconds_bucket|\
              aviary_(approval_wait|secret_read)_seconds_(bucket|count)|\
              go_goroutines|go_gc_duration_seconds(_count)?|go_memstats_heap_inuse_bytes|\
              process_(cpu_seconds_total|resident_memory_bytes|open_fds|start_time_seconds)|\
              process_network_(receive|transmit)_bytes_total"
            action: keep
      - job_name: aviary-state-metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [aviary-system]}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
              - __meta_kubernetes_pod_container_port_name
            regex: aviary;state-metrics;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed
            action: drop
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: aviary_(sandboxes|turns|turns_oldest_age_seconds|approvals_waiting)
            action: keep
      - job_name: aviary-depot
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [aviary-system]}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
              - __meta_kubernetes_pod_container_port_name
            regex: aviary;depot;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed
            action: drop
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: "\
              aviary_depot_request_duration_seconds_(bucket|count)|aviary_depot_object_bytes_total|\
              aviary_depot_volume_(capacity|available)_bytes|\
              process_(cpu_seconds_total|resident_memory_bytes|start_time_seconds)"
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.16.0@sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
