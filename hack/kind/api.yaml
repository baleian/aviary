# Exposes the Aviary API on a node port, which hack/kind/cluster.yaml maps to
# localhost:8080 and where the e2e reaches it as a client would. A client
# cannot authenticate through the API server proxy, which does not pass on
# the Authorization header.
apiVersion: v1
kind: Service
metadata:
  name: aviary-api
  namespace: aviary-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
