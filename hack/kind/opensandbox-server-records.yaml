# Where the lifecycle server of OpenSandbox keeps its records in the local
# cluster. It keeps them in a file, and what it knows of the templates is in
# no other place: a server that starts without the file has none, and makes
# no sandbox from the ones that were built.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensandbox-server-records
  namespace: opensandbox-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
