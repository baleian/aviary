apiVersion: v1
kind: Namespace
metadata:
  name: aviary-data
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: aviary-data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
  bootstrap:
    initdb:
      database: aviary
      owner: aviary
  storage:
    size: 1Gi
