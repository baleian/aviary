# PostgreSQL for the local cluster, installed by `make postgres`.
# The password is in the Secret postgres-users.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aviary-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
          env:
            - name: POSTGRES_DB
              value: aviary
            - name: POSTGRES_USER
              value: aviary
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-users
                  key: aviary
          ports:
            - name: postgres
              containerPort: 5432
          # During initialization the server listens only on its Unix
          # socket, and then restarts.
          readinessProbe:
            tcpSocket:
              port: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aviary-data
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
