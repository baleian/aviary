# The node port that hack/kind/cluster.yaml maps to localhost:3000.
service:
  type: NodePort
  nodePort: 30300
grafana.ini:
  # Signs everyone in as an administrator, without a password. Fine for the
  # local cluster, which only this machine reaches.
  auth.anonymous:
    enabled: true
    org_role: Admin
  auth:
    disable_login_form: true
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/aviary/aviary.json
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server
        isDefault: true
        jsonData:
          # The scrape interval, from which $__rate_interval is derived.
          timeInterval: 15s
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: aviary
        type: file
        options:
          path: /var/lib/grafana/dashboards/aviary
# A ConfigMap that make grafana creates from deploy/grafana/aviary.json.
dashboardsConfigMaps:
  aviary: grafana-dashboards
