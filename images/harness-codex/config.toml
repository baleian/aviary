# The default provider, for requests that name none, such as the session title
# that the ACP adapter has a model of its choosing write after the first turn.
# It points nowhere, so such requests fail. codex-acp-aviary gives sessions
# the aviary provider.
model_provider = "nobody"

[model_providers.nobody]
name = "Nobody"
base_url = "http://127.0.0.1:9/v1"
wire_api = "responses"
request_max_retries = 0
stream_max_retries = 0

[model_providers.aviary]
name = "Aviary"
wire_api = "responses"
env_key = "AVIARY_LLM_API_KEY"

# With plugins on, Codex downloads its plugin catalog into every new session
# home when it starts.
[features]
plugins = false
