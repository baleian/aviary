<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" role="img" aria-labelledby="title desc">
  <title id="title">The parts of Aviary</title>
  <desc id="desc">Clients call the Supervisor. The Supervisor has the API of Agent Substrate create, wake and put to sleep a sandbox for each session on its workers, and gives the turns to the runner in the sandbox through the router of Substrate. The object storage, a volume or an S3 bucket, keeps the files that messages carry and the snapshots of sleeping sandboxes with their homes, from which a session can wake on any worker. A sandbox reaches the outside only through the egress gateway of Substrate, which asks the Supervisor for the secrets of the turn.</desc>
  <style>
    svg {
      --bg: #ffffff; --frame: #d9e0ea;
      --zone: #f5f8fc; --zone-line: #b4c1d3;
      --box: #ffffff; --box-line: #93a2b8;
      --ink: #0d1b2e; --note: #55637a; --edge: #5d6b82;
      --accent: #0b6fe0; --accent-soft: #e8f1ff;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0b1526; --frame: #24344f;
        --zone: #101c31; --zone-line: #3a4c6c;
        --box: #16243d; --box-line: #4c6085;
        --ink: #e9eff8; --note: #a3b2c9; --edge: #93a1b9;
        --accent: #6cb2ff; --accent-soft: #14294b;
      }
    }
    .bg { fill: var(--bg); stroke: var(--frame); }
    .zone { fill: var(--zone); stroke: var(--zone-line); stroke-dasharray: 5 4; }
    .cluster { fill: none; stroke: var(--zone-line); stroke-dasharray: 5 4; }
    .closed { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { fill: var(--box); stroke: var(--box-line); }
    .hub { fill: var(--box); stroke: var(--ink); stroke-width: 1.5; }
    .out { fill: var(--box); stroke: var(--accent); stroke-width: 1.5; }
    .back { opacity: 0.55; }
    .gone { fill: none; stroke: var(--box-line); stroke-dasharray: 3 4; }
    .has { fill: var(--accent); stroke: var(--accent); }
    .off { fill: var(--note); opacity: 0.75; }
    .life { fill: none; stroke: var(--zone-line); stroke-dasharray: 2 5; }
    .loop { fill: none; stroke: var(--zone-line); }
    .tab { fill: var(--zone); stroke: var(--zone-line); }
    .e { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .e.way { stroke: var(--accent); }
    .e.ret { stroke-dasharray: 5 4; }
    .head { fill: var(--edge); }
    .head.way { fill: var(--accent); }
    .badge { fill: var(--ink); }
    text { fill: var(--ink); }
    .t { font-size: 16px; font-weight: 700; }
    .n { font-size: 13.5px; font-weight: 650; }
    .d { font-size: 12.5px; fill: var(--note); }
    .l { font-size: 12.5px; fill: var(--note); }
    .l.way { fill: var(--accent); }
    .z { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--note); }
    .m { font-size: 11.5px; fill: var(--note); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-size: 11.5px; font-weight: 700; fill: var(--bg); text-anchor: middle; }
    .c { text-anchor: middle; }
    .r { text-anchor: end; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head way" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="899" height="661" rx="14"/>


  <!-- Clients -->
  <text class="z" x="20" y="140">CLIENTS</text>
  <rect class="box" x="20" y="150" width="116" height="46" rx="8"/>
  <text class="n c" x="78" y="170">Web UI</text>
  <text class="d c" x="78" y="186">in the browser</text>
  <rect class="box" x="20" y="206" width="116" height="46" rx="8"/>
  <text class="n c" x="78" y="226">API clients</text>
  <text class="d c" x="78" y="242">your own tools</text>
  <path class="e" d="M136 173H152M136 229H152M152 173V229"/>
  <path class="e" d="M152 193H248" marker-end="url(#a)"/>
  <text class="l c" x="189" y="186">messages</text>
  <path class="e" d="M250 211H154" marker-end="url(#a)"/>
  <text class="l c" x="189" y="227">events</text>

  <!-- What the Supervisor is connected to -->
  <rect class="zone" x="20" y="296" width="194" height="246" rx="12"/>
  <text class="z" x="34" y="316">YOUR SERVICES</text>
  <rect class="box" x="32" y="326" width="170" height="44" rx="8"/>
  <text class="n" x="44" y="344">Database</text>
  <text class="d" x="44" y="360">PostgreSQL, MySQL</text>
  <rect class="box" x="32" y="378" width="170" height="44" rx="8"/>
  <text class="n" x="44" y="396">Event log</text>
  <text class="d" x="44" y="412">Valkey, Redis</text>
  <rect class="box" x="32" y="430" width="170" height="44" rx="8"/>
  <text class="n" x="44" y="448">Identity provider</text>
  <text class="d" x="44" y="464">OpenID Connect</text>
  <rect class="box" x="32" y="482" width="170" height="44" rx="8"/>
  <text class="n" x="44" y="500">Secret stores</text>
  <text class="d" x="44" y="516">of the projects</text>
  <path class="e" d="M250 256H186V294" marker-end="url(#a)"/>
  <text class="l r" x="178" y="282">through plugins</text>

  <!-- The cluster -->
  <rect class="cluster" x="226" y="24" width="662" height="454" rx="14"/>
  <text class="z" x="242" y="44">KUBERNETES CLUSTER</text>
  <rect class="hub back" x="258" y="146" width="210" height="118" rx="10"/>
  <rect class="hub back" x="254" y="150" width="210" height="118" rx="10"/>
  <rect class="hub" x="250" y="154" width="210" height="118" rx="10"/>
  <text class="t" x="266" y="180">Supervisor</text>
  <text class="d" x="266" y="203">serves the API</text>
  <text class="d" x="266" y="221">queues and runs the turns</text>
  <text class="d" x="266" y="239">gives the secrets of a turn</text>

  <!-- The object storage -->
  <rect class="box" x="250" y="56" width="630" height="48" rx="10"/>
  <text class="n c" x="565" y="77">Object storage</text>
  <text class="d c" x="565" y="94">a volume or an S3 bucket</text>
  <path class="e" d="M306 106V152" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="314" y="134">attachments</text>
  <path class="e" d="M820 106V140" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l r" x="812" y="120">sleeps as a snapshot,</text>
  <text class="l r" x="812" y="135">wakes on any worker</text>

  <!-- Agent Substrate: its API and router -->
  <rect class="box" x="492" y="150" width="136" height="40" rx="8"/>
  <text class="n c" x="560" y="168">Substrate API</text>
  <text class="d c" x="560" y="183">actors, policies</text>
  <path class="e" d="M470 170H490" marker-end="url(#a)"/>
  <path class="e" d="M628 170H648" marker-end="url(#a)"/>
  <text class="l c" x="560" y="208">creates, wakes,</text>
  <text class="l c" x="560" y="223">puts to sleep</text>
  <rect class="box" x="492" y="238" width="136" height="36" rx="8"/>
  <text class="n c" x="560" y="261">Substrate router</text>
  <path class="e" d="M470 256H490" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l c" x="560" y="292">turns down · events up</text>

  <!-- The workers and the sandboxes on them -->
  <rect class="closed" x="650" y="142" width="230" height="200" rx="12"/>
  <text class="z" x="664" y="162">WORKERS</text>
  <text class="m r" x="866" y="162">aviary-runtime</text>
  <rect class="box back" x="672" y="178" width="188" height="148" rx="10"/>
  <rect class="box back" x="668" y="182" width="188" height="148" rx="10"/>
  <rect class="box" x="664" y="186" width="188" height="148" rx="10"/>
  <text class="n" x="676" y="207">Session sandbox</text>
  <text class="d" x="676" y="223">gVisor · no API keys</text>
  <rect class="box" x="676" y="239" width="64" height="34" rx="6"/>
  <text class="n c" x="708" y="261">runner</text>
  <rect class="box" x="768" y="239" width="72" height="34" rx="6"/>
  <text class="n c" x="804" y="261">harness</text>
  <path class="e" d="M742 256H766" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="e" d="M630 256H674" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l c" x="754" y="287">ACP</text>
  <rect class="box" x="676" y="296" width="164" height="28" rx="14"/>
  <text class="n c" x="758" y="315">/home</text>

  <!-- The egress gateway of Agent Substrate -->
  <rect class="out back" x="438" y="382" width="220" height="64" rx="10"/>
  <rect class="out back" x="434" y="386" width="220" height="64" rx="10"/>
  <rect class="out" x="430" y="390" width="220" height="64" rx="10"/>
  <text class="n c" x="540" y="416">Egress gateway</text>
  <text class="d c" x="540" y="434">of Substrate: the only way out</text>
  <path class="e" d="M444 390V274" marker-end="url(#a)"/>
  <text class="l" x="452" y="324">asks for the secrets</text>
  <text class="l" x="452" y="339">of the turn's provider</text>
  <text class="l" x="452" y="354">and MCP servers</text>
  <path class="e way" d="M766 342V422H660" marker-end="url(#w)"/>
  <text class="l way" x="774" y="378">all outbound</text>
  <text class="l way" x="774" y="393">traffic</text>

  <!-- Where the egress gateway sends on -->
  <rect class="zone" x="430" y="522" width="458" height="124" rx="12"/>
  <text class="z" x="444" y="542">WHAT A SANDBOX REACHES</text>
  <rect class="box" x="444" y="552" width="150" height="80" rx="8"/>
  <text class="n c" x="519" y="573">Model endpoints</text>
  <text class="d c" x="519" y="591">a provider's API,</text>
  <text class="d c" x="519" y="606">an AI gateway,</text>
  <text class="d c" x="519" y="621">your model server</text>
  <rect class="box" x="604" y="552" width="124" height="80" rx="8"/>
  <text class="n c" x="666" y="573">MCP servers</text>
  <text class="d c" x="666" y="591">that the session</text>
  <text class="d c" x="666" y="606">has on</text>
  <rect class="box" x="738" y="552" width="136" height="80" rx="8"/>
  <text class="n c" x="806" y="573">Other hosts</text>
  <text class="d c" x="806" y="591">that the</text>
  <text class="d c" x="806" y="606">installation allows</text>
  <path class="e way" d="M540 454V520" marker-end="url(#w)"/>
  <text class="l way" x="548" y="504">with the secrets put in, to the hosts of the turn only</text>

  <!-- Legend -->
  <rect class="box back" x="28" y="564" width="26" height="16" rx="4"/>
  <rect class="box back" x="24" y="568" width="26" height="16" rx="4"/>
  <rect class="box" x="20" y="572" width="26" height="16" rx="4"/>
  <text class="d" x="64" y="579">replicas, or</text>
  <text class="d" x="64" y="594">one per session</text>
  <rect class="closed" x="20" y="612" width="34" height="18" rx="5"/>
  <text class="d" x="64" y="619">reached only through</text>
  <text class="d" x="64" y="634">the router and the gateway</text>
</svg>
