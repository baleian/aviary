<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">The life of a sandbox</title>
  <desc id="desc">An awake session has a pod and a volume. Without a turn it is put to sleep: the pod is deleted and the volume kept. After a long sleep its home is archived in the depot and the volume is deleted too. The next message wakes a sleeping session in a new pod, and restores an archived home into a new sandbox.</desc>
  <style>
    svg {
      --bg: #ffffff; --frame: #d9e0ea;
      --zone: #f5f8fc; --zone-line: #b4c1d3;
      --box: #ffffff; --box-line: #93a2b8;
      --ink: #0d1b2e; --note: #55637a; --edge: #5d6b82;
      --accent: #0b6fe0; --accent-soft: #e8f1ff;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0b1526; --frame: #24344f;
        --zone: #101c31; --zone-line: #3a4c6c;
        --box: #16243d; --box-line: #4c6085;
        --ink: #e9eff8; --note: #a3b2c9; --edge: #93a1b9;
        --accent: #6cb2ff; --accent-soft: #14294b;
      }
    }
    .bg { fill: var(--bg); stroke: var(--frame); }
    .zone { fill: var(--zone); stroke: var(--zone-line); stroke-dasharray: 5 4; }
    .cluster { fill: none; stroke: var(--zone-line); stroke-dasharray: 5 4; }
    .closed { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { fill: var(--box); stroke: var(--box-line); }
    .hub { fill: var(--box); stroke: var(--ink); stroke-width: 1.5; }
    .out { fill: var(--box); stroke: var(--accent); stroke-width: 1.5; }
    .back { opacity: 0.55; }
    .gone { fill: none; stroke: var(--box-line); stroke-dasharray: 3 4; }
    .has { fill: var(--accent); stroke: var(--accent); }
    .off { fill: var(--note); opacity: 0.75; }
    .life { fill: none; stroke: var(--zone-line); stroke-dasharray: 2 5; }
    .loop { fill: none; stroke: var(--zone-line); }
    .tab { fill: var(--zone); stroke: var(--zone-line); }
    .e { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .e.way { stroke: var(--accent); }
    .e.ret { stroke-dasharray: 5 4; }
    .head { fill: var(--edge); }
    .head.way { fill: var(--accent); }
    .badge { fill: var(--ink); }
    text { fill: var(--ink); }
    .t { font-size: 16px; font-weight: 700; }
    .n { font-size: 13.5px; font-weight: 650; }
    .d { font-size: 12.5px; fill: var(--note); }
    .l { font-size: 12.5px; fill: var(--note); }
    .l.way { fill: var(--accent); }
    .z { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--note); }
    .m { font-size: 11.5px; fill: var(--note); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-size: 11.5px; font-weight: 700; fill: var(--bg); text-anchor: middle; }
    .c { text-anchor: middle; }
    .r { text-anchor: end; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head way" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="899" height="419" rx="14"/>


  <!-- The states, and what a session has in each -->
  <rect class="box" x="40" y="70" width="210" height="126" rx="10"/>
  <text class="t" x="56" y="96">Awake</text>
  <rect class="has" x="56" y="111" width="14" height="14" rx="3"/>
  <text class="n" x="80" y="122">pod</text>
  <rect class="has" x="56" y="135" width="14" height="14" rx="3"/>
  <text class="n" x="80" y="146">volume</text>
  <rect class="gone" x="56" y="159" width="14" height="14" rx="3"/>
  <text class="d" x="80" y="170">archive in the depot</text>
  <rect class="box" x="345" y="70" width="210" height="126" rx="10"/>
  <text class="t" x="361" y="96">Asleep</text>
  <rect class="gone" x="361" y="111" width="14" height="14" rx="3"/>
  <text class="d" x="385" y="122">pod</text>
  <rect class="has" x="361" y="135" width="14" height="14" rx="3"/>
  <text class="n" x="385" y="146">volume</text>
  <rect class="gone" x="361" y="159" width="14" height="14" rx="3"/>
  <text class="d" x="385" y="170">archive in the depot</text>
  <rect class="box" x="650" y="70" width="210" height="126" rx="10"/>
  <text class="t" x="666" y="96">Archived</text>
  <rect class="gone" x="666" y="111" width="14" height="14" rx="3"/>
  <text class="d" x="690" y="122">pod</text>
  <rect class="gone" x="666" y="135" width="14" height="14" rx="3"/>
  <text class="d" x="690" y="146">volume</text>
  <rect class="has" x="666" y="159" width="14" height="14" rx="3"/>
  <text class="n" x="690" y="170">archive in the depot</text>

  <!-- Without a turn -->
  <path class="e" d="M250 110H343" marker-end="url(#a)"/>
  <text class="l c" x="297" y="48">5 minutes</text>
  <text class="l c" x="297" y="62">without a turn</text>
  <text class="m c" x="297" y="128">idleSeconds</text>
  <path class="e" d="M555 110H648" marker-end="url(#a)"/>
  <text class="l c" x="602" y="48">a week</text>
  <text class="l c" x="602" y="62">asleep</text>
  <text class="m c" x="602" y="128">archiveAfter</text>
  <text class="m c" x="602" y="141">Seconds</text>

  <!-- The next message -->
  <path class="e way" d="M510 196V240H180V198" marker-end="url(#w)"/>
  <text class="l way c" x="345" y="233">the next message: a new pod, the same volume</text>
  <path class="e way" d="M755 196V300H557" marker-end="url(#w)"/>
  <text class="l way" x="763" y="256">the next</text>
  <text class="l way" x="763" y="270">message</text>
  <rect class="out" x="345" y="272" width="210" height="56" rx="10"/>
  <text class="n c" x="450" y="296">Restoring</text>
  <text class="d c" x="450" y="314">the home, into a new sandbox</text>
  <path class="e way" d="M345 300H110V198" marker-end="url(#w)"/>
  <text class="l way c" x="228" y="293">then its turn runs</text>

  <!-- The end -->
  <rect class="zone" x="40" y="350" width="820" height="52" rx="10"/>
  <text class="n" x="56" y="372">Ended</text>
  <text class="d" x="108" y="372">by its owner, with its agent or after a time: the sandbox is deleted, with its volume or</text>
  <text class="d" x="108" y="388">its archive. The conversation stays.</text>
</svg>
