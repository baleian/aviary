<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">The life of a sandbox</title>
  <desc id="desc">An awake session has a sandbox that takes room on a worker. Without a turn for a while, or when its worker goes away, it is put to sleep: a snapshot that Agent Substrate keeps holds it, and it leaves the worker. The next turn wakes it on a worker that has room. When the session ends, the sandbox is deleted with its snapshot, and the conversation stays.</desc>
  <style>
    svg {
      --bg: #ffffff; --frame: #d9e0ea;
      --zone: #f5f8fc; --zone-line: #b4c1d3;
      --box: #ffffff; --box-line: #93a2b8;
      --ink: #0d1b2e; --note: #55637a; --edge: #5d6b82;
      --accent: #0b6fe0; --accent-soft: #e8f1ff;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0b1526; --frame: #24344f;
        --zone: #101c31; --zone-line: #3a4c6c;
        --box: #16243d; --box-line: #4c6085;
        --ink: #e9eff8; --note: #a3b2c9; --edge: #93a1b9;
        --accent: #6cb2ff; --accent-soft: #14294b;
      }
    }
    .bg { fill: var(--bg); stroke: var(--frame); }
    .zone { fill: var(--zone); stroke: var(--zone-line); stroke-dasharray: 5 4; }
    .cluster { fill: none; stroke: var(--zone-line); stroke-dasharray: 5 4; }
    .closed { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { fill: var(--box); stroke: var(--box-line); }
    .hub { fill: var(--box); stroke: var(--ink); stroke-width: 1.5; }
    .out { fill: var(--box); stroke: var(--accent); stroke-width: 1.5; }
    .back { opacity: 0.55; }
    .gone { fill: none; stroke: var(--box-line); stroke-dasharray: 3 4; }
    .has { fill: var(--accent); stroke: var(--accent); }
    .off { fill: var(--note); opacity: 0.75; }
    .life { fill: none; stroke: var(--zone-line); stroke-dasharray: 2 5; }
    .loop { fill: none; stroke: var(--zone-line); }
    .tab { fill: var(--zone); stroke: var(--zone-line); }
    .e { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .e.way { stroke: var(--accent); }
    .e.ret { stroke-dasharray: 5 4; }
    .head { fill: var(--edge); }
    .head.way { fill: var(--accent); }
    .badge { fill: var(--ink); }
    text { fill: var(--ink); }
    .t { font-size: 16px; font-weight: 700; }
    .n { font-size: 13.5px; font-weight: 650; }
    .d { font-size: 12.5px; fill: var(--note); }
    .l { font-size: 12.5px; fill: var(--note); }
    .l.way { fill: var(--accent); }
    .z { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--note); }
    .m { font-size: 11.5px; fill: var(--note); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-size: 11.5px; font-weight: 700; fill: var(--bg); text-anchor: middle; }
    .c { text-anchor: middle; }
    .r { text-anchor: end; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head way" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="899" height="329" rx="14"/>


  <!-- The states, and what a session has in each -->
  <rect class="box" x="40" y="40" width="290" height="126" rx="10"/>
  <text class="t" x="56" y="66">Awake</text>
  <rect class="has" x="56" y="81" width="14" height="14" rx="3"/>
  <text class="n" x="80" y="92">room on a worker</text>
  <rect class="has" x="56" y="105" width="14" height="14" rx="3"/>
  <text class="n" x="80" y="116">the harness, running</text>
  <rect class="has" x="56" y="129" width="14" height="14" rx="3"/>
  <text class="n" x="80" y="140">its home, /home</text>
  <rect class="box" x="570" y="40" width="290" height="126" rx="10"/>
  <text class="t" x="586" y="66">Asleep</text>
  <rect class="gone" x="586" y="81" width="14" height="14" rx="3"/>
  <text class="d" x="610" y="92">room on a worker</text>
  <rect class="has" x="586" y="105" width="14" height="14" rx="3"/>
  <text class="n" x="610" y="116">a snapshot, kept by Substrate</text>
  <rect class="has" x="586" y="129" width="14" height="14" rx="3"/>
  <text class="n" x="610" y="140">its home, in the snapshot</text>

  <!-- Without a turn -->
  <path class="e" d="M330 100H568" marker-end="url(#a)"/>
  <text class="l c" x="450" y="78">5 minutes without a turn,</text>
  <text class="l c" x="450" y="92">or its worker goes away</text>
  <text class="m c" x="450" y="118">idleSeconds</text>

  <!-- The next turn -->
  <path class="e way" d="M715 166V206H185V168" marker-end="url(#w)"/>
  <text class="l way c" x="450" y="199">the next turn wakes it on a worker that has room</text>

  <!-- The end -->
  <rect class="zone" x="40" y="236" width="820" height="56" rx="10"/>
  <text class="n" x="56" y="259">Ended</text>
  <text class="d" x="108" y="259">by its owner, with its agent or after a time: the sandbox is deleted with its snapshot.</text>
  <text class="d" x="108" y="275">The conversation stays.</text>
</svg>
