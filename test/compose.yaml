# Services for the tests of the Supervisor's plugins; the other Supervisor
# tests keep their data in memory. `make test-supervisor` creates them anew
# for every run and removes them afterwards.
services:
  database-postgres:
    image: ${DOCKER_IO:-docker.io}/library/postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql
    # Each test has its own database and the tests run in parallel, which
    # takes more connections than the default allows.
    command: ["postgres", "-c", "max_connections=500"]
    healthcheck:
      # Over TCP: while the image initializes the database, the server
      # listens only on its Unix socket, and is then restarted.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres"]
      interval: 1s
      retries: 60
  database-mysql:
    image: ${DOCKER_IO:-docker.io}/library/mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_ROOT_PASSWORD: test
    tmpfs:
      - /var/lib/mysql
    # Each test has its own database and the tests run in parallel, which
    # takes more connections than the default allows. An empty sql_mode
    # accepts values that do not fit a column, as some servers are
    # configured to; the plugin must reject them anyway.
    command: ["--max-connections=1000", "--sql-mode="]
    healthcheck:
      # Over TCP, as for PostgreSQL.
      test: ["CMD", "mysqladmin", "ping", "--host", "127.0.0.1", "--user", "root", "--password=test"]
      interval: 1s
      retries: 60
  events-valkey:
    image: ${DOCKER_IO:-docker.io}/valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command: ["valkey-server", "--requirepass", "test", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "-a", "test", "ping"]
      interval: 1s
      retries: 60
  # 7.2 is the last Redis release line under the BSD license.
  events-redis:
    image: ${DOCKER_IO:-docker.io}/library/redis:7.2.17@sha256:5b816bb37d9707a70f10ef5002ecf8ee431750d397010fc4314c93dca887962f
    command: ["redis-server", "--requirepass", "test", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "test", "ping"]
      interval: 1s
      retries: 60
  # OpenBao in dev mode: unsealed and in memory. The tests configure it with
  # the root token.
  secret-store:
    image: ${DOCKER_IO:-docker.io}/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    cap_add: ["IPC_LOCK"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: test
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 1s
      retries: 60
