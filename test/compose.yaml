# What the tests of the Supervisor's plugins run against: the tests of the
# Supervisor itself keep their records and events in memory. Each run of the
# tests starts it anew and removes it, so nothing is kept from one run to the
# next.
services:
  # A database server, for the tests of the plugin that connects to
  # databases of its kind. It is PostgreSQL.
  database:
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql
    # Every test has a database of its own, and they run at once: together
    # they open more connections than PostgreSQL takes by default.
    command: ["postgres", "-c", "max_connections=500"]
    healthcheck:
      # Over the network: while the image sets the database up, PostgreSQL
      # answers on its socket only, and is then started again.
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres"]
      interval: 1s
      retries: 60
  # An event log, for the tests of the plugin that connects to logs of its
  # kind. It is Valkey.
  events:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command: ["valkey-server", "--requirepass", "test", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "-a", "test", "ping"]
      interval: 1s
      retries: 60
  # A secret store, for the tests of the plugin that asks stores of its
  # kind. It is OpenBao, which runs unsealed here and keeps nothing, and the
  # tests set it up with its root token.
  secret-store:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    cap_add: ["IPC_LOCK"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: test
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 1s
      retries: 60
