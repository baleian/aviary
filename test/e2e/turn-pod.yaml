apiVersion: v1
kind: Pod
metadata:
  name: turn-${TURN}
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: ${NODE}
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: ${HARNESS_IMAGE}
      command: ["/aviary/bin/aviary-runner"]
      args: ${ARGS}
      workingDir: /home/workspace
      env:
        - name: HOME
          value: /home
      envFrom:
        - secretRef:
            name: aviary-llm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: store
          mountPath: /home
          subPath: projects/default/agents/default/sessions/${SESSION}/home
        - name: runner
          mountPath: /aviary/bin
  volumes:
    - name: store
      persistentVolumeClaim:
        claimName: aviary-store-default
    - name: runner
      image:
        reference: aviary-runner:dev
