# Exposes the Aviary API on a node port, where the e2e reaches it as a client
# would. The API server proxy does not pass on the Authorization header, so
# the tests could not authenticate through it.
apiVersion: v1
kind: Service
metadata:
  name: aviary-supervisor-e2e
  namespace: aviary-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
