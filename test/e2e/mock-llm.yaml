# The model server that the e2e uses in place of a real one, and the secret
# with its API key for the Egress Proxy.
apiVersion: v1
kind: Namespace
metadata:
  name: aviary-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: aviary-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-llm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-llm
          image: aviary-mock-llm:dev
          env:
            # The same key is in the secret below.
            - name: MOCK_LLM_API_KEY
              value: mock-llm-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: aviary-e2e
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: aviary-llm-mock
  namespace: aviary-system
stringData:
  api-key: mock-llm-key
