# The model server that the e2e uses in place of a real one. The tests
# register it as the provider of their agents.
apiVersion: v1
kind: Namespace
metadata:
  name: aviary-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: aviary-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-llm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-llm
          image: aviary-mock-llm:dev
          env:
            # The tests give the providers of their agents this key.
            - name: MOCK_LLM_API_KEY
              value: mock-llm-key
            # Over HTTPS too: only a model request over HTTPS gets its key.
            # `make e2e-up` makes the secret with the certificate.
            - name: MOCK_LLM_TLS_CERTIFICATE
              value: /etc/mock-llm/tls/tls.crt
            - name: MOCK_LLM_TLS_KEY
              value: /etc/mock-llm/tls/tls.key
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: tls
              mountPath: /etc/mock-llm/tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls
          secret:
            secretName: mock-llm-tls
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: aviary-e2e
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
