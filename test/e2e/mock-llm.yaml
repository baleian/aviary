# The mock model server, which the tests register as the provider of their
# agents.
apiVersion: v1
kind: Namespace
metadata:
  name: aviary-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: aviary-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-llm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-llm
          image: aviary-mock-llm:dev
          env:
            # The API key that the tests give their providers.
            - name: MOCK_LLM_API_KEY
              value: mock-llm-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: aviary-e2e
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The mock model server as the MCP servers of the tests, each at a host of
# its own: the egress gateway puts a secret into a header of the requests to
# a host whichever server they are for.
apiVersion: v1
kind: Service
metadata:
  name: mock-mcp
  namespace: aviary-e2e
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mock-sse
  namespace: aviary-e2e
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: http
      port: 80
      targetPort: http
---
# A port where nothing listens. Its connections reach the pod of the mock
# model server, which refuses them, whatever the network of the cluster does
# with a port that no Service has.
apiVersion: v1
kind: Service
metadata:
  name: mock-closed
  namespace: aviary-e2e
spec:
  selector:
    app.kubernetes.io/name: mock-llm
  ports:
    - name: https
      port: 443
      targetPort: 9
