apiVersion: v1
kind: Pod
metadata:
  name: session-${SESSION}
spec:
  restartPolicy: Never
  containers:
    - name: init
      image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      command: ["sh", "-c", "mkdir /home/workspace && chown -R 10000:10000 /home"]
      volumeMounts:
        - name: store
          mountPath: /home
          subPath: projects/default/agents/default/sessions/${SESSION}/home
  volumes:
    - name: store
      persistentVolumeClaim:
        claimName: aviary-store-default
