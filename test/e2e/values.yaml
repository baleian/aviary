# Values for the e2e: more than one replica of each component, and the mock
# model server as the only host that sandboxes reach besides the providers
# and the servers of their turns. make e2e-up adds the harness images.
supervisor:
  replicas: 2
  # The cluster's secret store, which `make openbao` installs. The short
  # cache lets a test see a changed value soon.
  secretStores:
    allowedHosts:
      - openbao.aviary-data:8200
    cacheSeconds: 5
depot:
  replicas: 2
workers:
  replicas: 2
  resources:
    limits: {cpu: "8", memory: 12Gi}
sandboxes:
  # Short, so that the tests see sessions sleep without a long wait.
  idleSeconds: 30
  allowedHosts:
    - http://mock-llm.aviary-e2e
  # A provider at localhost is the mock model server, as it is a model on
  # the machine of an installation that names that machine.
  localhost: mock-llm.aviary-e2e
runtime:
  harnesses:
    # Small, so that the sessions of the parallel tests fit on the workers.
    opencode:
      resources:
        limits: {cpu: "1", memory: 1Gi}
    codex:
      resources:
        limits: {cpu: "1", memory: 512Mi}
    claude-code:
      resources:
        limits: {cpu: "1", memory: 1Gi}
