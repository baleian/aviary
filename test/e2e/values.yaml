# How the e2e installs Aviary: with more than one of each of its parts, and
# with the model servers of the tests as the only hosts that the Egress Proxy
# lets requests through to.
supervisor:
  replicas: 2
  # The secret store of the cluster, which `make secret-store` installs. What
  # is read from it is used for a few seconds only, so that a test can wait
  # for a value that it changed to be read again.
  secretStores:
    allowedHosts:
      - openbao.aviary-data:8200
    cacheSeconds: 5
egressProxy:
  replicas: 2
  allowedHosts:
    - mock-llm.aviary-e2e
    - mock-llm-other.aviary-e2e
  # The model servers of the tests are in the cluster.
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: aviary-e2e}
runtime:
  harnesses:
    # Less than a harness asks for by default, so that the turns of the tests
    # that run at once fit on a small cluster.
    opencode:
      resources:
        requests: {cpu: 100m, memory: 384Mi}
    codex:
      resources:
        requests: {cpu: 100m, memory: 192Mi}
