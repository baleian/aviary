# How the e2e installs Aviary: with more than one of each of its parts.
supervisor:
  replicas: 2
  # The secret store of the cluster, which `make secret-store` installs. What
  # is read from it is used for a few seconds only, so that a test can wait
  # for a value that it changed to be read again.
  secretStores:
    allowedHosts:
      - openbao.aviary-data:8200
    cacheSeconds: 5
sandboxes:
  # So that a test sees a session sleep without waiting five minutes for it.
  idleSeconds: 30
