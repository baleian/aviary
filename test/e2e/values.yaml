# Values for the e2e: more than one replica of each component, and the mock
# model server as the only allowed host.
supervisor:
  replicas: 2
  # The cluster's secret store, which `make openbao` installs. The short
  # cache lets a test see a changed value soon.
  secretStores:
    allowedHosts:
      - openbao.aviary-data:8200
    cacheSeconds: 5
egressProxy:
  replicas: 2
  allowedHosts:
    - mock-llm.aviary-e2e
  # The mock model server runs in the cluster.
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: aviary-e2e}
  # A provider at localhost is the mock model server, as it is a model on
  # the machine of an installation that names that machine.
  localhost: mock-llm.aviary-e2e
sandboxes:
  # Short, so that the tests see sessions sleep without a long wait.
  idleSeconds: 30
runtime:
  harnesses:
    # Below the defaults, so that the sessions of the parallel tests fit on a
    # small cluster.
    opencode:
      resources:
        requests: {cpu: 100m, memory: 384Mi}
    codex:
      resources:
        requests: {cpu: 100m, memory: 192Mi}
