# How the e2e installs Aviary: with more than one of each of its parts, and
# with the model server of the tests as the model endpoint and as the only
# host that the Egress Proxy lets requests through to.
supervisor:
  replicas: 2
llm:
  url: http://mock-llm.aviary-e2e/v1
  model: mock
  apiKey:
    secretName: aviary-llm-mock
egressProxy:
  replicas: 2
  allowedHosts:
    - mock-llm.aviary-e2e
  # The model server of the tests is in the cluster.
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: aviary-e2e}
runtime:
  harnesses:
    # Less than a harness asks for by default, so that the turns of the tests
    # that run at once fit on a small cluster.
    opencode:
      resources:
        requests: {cpu: 100m, memory: 384Mi}
    codex:
      resources:
        requests: {cpu: 100m, memory: 192Mi}
