# Values that differ from the chart's own, to see that the chart follows them.
supervisor:
  replicas: 3
  encryption:
    secretName: other-keys
    key: k2
  secretStores:
    allowedHosts:
      - secrets.example.com:8200
      - store.example.com
    cacheSeconds: 5
  auth:
    provider:
      kind: oidc
      settings:
        issuer: https://login.example.com/realms/main
        audience: aviary
        claims: {username: email}
    admins: [platform]
    users: [team-a, team-b]
egressProxy:
  replicas: 2
  allowedHosts:
    - llm.example.com
    - packages.example.com
    - git.example.com:8443
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: llm-gateway}
sandboxes:
  url: https://sandboxes.example.com
  templateStore: s3://example/templates
runtime:
  maxConcurrentTurns: 7
  maxQueuedTurns: 11
  maxQueueWaitSeconds: 13
  maxStartupSeconds: 17
  maxTurnSeconds: 7200
  maxReconnectSeconds: 19
  maxToolOutputBytes: 23
  harnesses:
    opencode:
      resources:
        requests: {memory: 333Mi}
      sandbox: {disk: 16Gi}
