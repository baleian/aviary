# Values that differ from the defaults, to check that the chart applies them.
supervisor:
  replicas: 3
  encryption:
    secretName: other-keys
    key: k2
  secretStores:
    allowedHosts:
      - secrets.example.com:8200
      - store.example.com
    cacheSeconds: 5
  auth:
    provider:
      kind: oidc
      settings:
        issuer: https://login.example.com/realms/main
        audience: aviary
        claims: {username: email}
    admins: [platform]
    users: [team-a, team-b]
  allowedOrigins: [https://aviary.example.com]
stateMetrics:
  enabled: false
depot:
  replicas: 3
  volume:
    size: 100Gi
    storageClass: shared
    accessMode: ReadWriteMany
substrate:
  namespace: substrate-system
  atespace: team-a
workers:
  replicas: 5
  image: registry.example.com/ateworker-gvisor@sha256:1111111111111111111111111111111111111111111111111111111111111111
  resources:
    limits: {cpu: "16", memory: 64Gi}
sandboxes:
  idleSeconds: 0
  retentionSeconds: 604800
  snapshot: rootfs
  allowedHosts:
    - https://llm.example.com
    - https://*.packages.example.com
    - https://git.example.com:8443
  localhost: host.example.com
runtime:
  maxConcurrentTurns: 7
  maxQueuedTurns: 11
  maxQueueWaitSeconds: 13
  maxStartupSeconds: 17
  maxTurnSeconds: 7200
  maxToolOutputBytes: 23
  maxAttachmentBytes: 29
  maxAttachments: 0
  harnesses:
    opencode:
      image: registry.example.com/aviary-harness-opencode@sha256:2222222222222222222222222222222222222222222222222222222222222222
      resources:
        limits: {cpu: "2", memory: 8Gi}
    codex:
      image: registry.example.com/aviary-harness-codex@sha256:3333333333333333333333333333333333333333333333333333333333333333
      resources:
        limits: {cpu: "1", memory: 1Gi}
