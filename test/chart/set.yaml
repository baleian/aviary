# Values that differ from the defaults, to check that the chart applies them.
supervisor:
  replicas: 3
  encryption:
    secretName: other-keys
    key: k2
  secretStores:
    allowedHosts:
      - secrets.example.com:8200
      - store.example.com
    cacheSeconds: 5
  auth:
    provider:
      kind: oidc
      settings:
        issuer: https://login.example.com/realms/main
        audience: aviary
        claims: {username: email}
    admins: [platform]
    users: [team-a, team-b]
  allowedOrigins: [https://aviary.example.com]
stateMetrics:
  enabled: false
egressProxy:
  replicas: 2
  concurrency: 4
  allowedHosts:
    - llm.example.com
    - packages.example.com
    - git.example.com:8443
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: llm-gateway}
  localhost: host.example.com
sandboxes:
  idleSeconds: 0
  retentionSeconds: 604800
runtime:
  maxConcurrentTurns: 7
  maxQueuedTurns: 11
  maxQueueWaitSeconds: 13
  maxStartupSeconds: 17
  maxTurnSeconds: 7200
  maxToolOutputBytes: 23
  harnesses:
    opencode:
      resources:
        limits: {memory: 8Gi}
  volume:
    size: 50Gi
    storageClass: fast
