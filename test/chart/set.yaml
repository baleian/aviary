# Values that differ from the chart's own, to see that the chart follows them.
supervisor:
  replicas: 3
  encryption:
    secretName: other-keys
    key: k2
  resolver:
    secretName: other-resolver-tls
  secretStores:
    allowedHosts:
      - secrets.example.com:8200
      - store.example.com
    cacheSeconds: 5
  auth:
    provider:
      kind: oidc
      settings:
        issuer: https://login.example.com/realms/main
        audience: aviary
        claims: {username: email}
    admins: [platform]
    users: [team-a, team-b]
sandboxes:
  url: https://sandboxes.example.com
  allowedHosts: [pypi.org, "*.example.com"]
  templateStore: s3://example/templates
  idleSeconds: 0
  retentionSeconds: 604800
runtime:
  maxConcurrentTurns: 7
  maxQueuedTurns: 11
  maxQueueWaitSeconds: 13
  maxStartupSeconds: 17
  maxTurnSeconds: 7200
  maxToolOutputBytes: 23
  harnesses:
    opencode:
      sandbox: {disk: 16Gi}
