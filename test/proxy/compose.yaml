# The Egress Proxy as the chart sets it up, once for each file of values in
# this directory. `make test-proxy` writes the configuration that the chart
# makes of the values to .out/proxy and names the image of the chart.
services:
  listed: &proxy
    image: ${ENVOY_IMAGE}
    command: ["--config-path", "/etc/envoy/envoy.yaml", "--disable-hot-restart", "--log-level", "warn"]
    volumes:
      - ../../.out/proxy/listed:/etc/envoy:ro
      - ../../.out/proxy/llm:/etc/aviary/llm:ro
  open:
    <<: *proxy
    volumes:
      - ../../.out/proxy/open:/etc/envoy:ro
      - ../../.out/proxy/llm:/etc/aviary/llm:ro
  closed:
    <<: *proxy
    volumes:
      - ../../.out/proxy/closed:/etc/envoy:ro
      - ../../.out/proxy/llm:/etc/aviary/llm:ro
