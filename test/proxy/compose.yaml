# One Egress Proxy for each values file in this directory, configured as the
# chart renders it. `make test-proxy` writes the configurations to .out/proxy
# and sets ENVOY_IMAGE to the chart's Envoy image.
services:
  listed: &proxy
    image: ${ENVOY_IMAGE}
    command: ["--config-path", "/etc/envoy/envoy.yaml", "--disable-hot-restart", "--log-level", "warn"]
    volumes:
      - ../../.out/proxy/listed:/etc/envoy:ro
      - ../../.out/proxy/tls/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
  open:
    <<: *proxy
    volumes:
      - ../../.out/proxy/open:/etc/envoy:ro
      - ../../.out/proxy/tls/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
  closed:
    <<: *proxy
    volumes:
      - ../../.out/proxy/closed:/etc/envoy:ro
      - ../../.out/proxy/tls/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
