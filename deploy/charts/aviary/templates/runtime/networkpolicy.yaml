# What a turn pod can connect to. The agent in it may do other things than
# it was asked to, so the pod reaches the Supervisor's port for the runners
# and the Egress Proxy, and nothing else: no other pod, no address outside
# and no DNS. Nothing connects to it. What it sends out goes through the
# Egress Proxy, which decides and keeps a record.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aviary-turn-pods
  namespace: aviary-runtime
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aviary
              app.kubernetes.io/component: supervisor
      ports:
        - {protocol: TCP, port: 9090}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aviary
              app.kubernetes.io/component: egress-proxy
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 3128}
