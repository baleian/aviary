# An agent may do more than it was asked to, so a sandbox can reach only the
# Egress Proxy: no other pod, no outside address and no DNS. Only the
# Supervisors can connect to it, at the runner.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aviary-sandboxes
  namespace: aviary-runtime
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aviary
              app.kubernetes.io/component: supervisor
      ports:
        - {protocol: TCP, port: 8700}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aviary
              app.kubernetes.io/component: egress-proxy
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 3128}
