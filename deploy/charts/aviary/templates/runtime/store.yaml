apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aviary-store-default
  namespace: aviary-runtime
  annotations:
    helm.sh/resource-policy: keep
spec:
  storageClassName: {{ .Values.runtime.store.storageClassName }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.runtime.store.size }}
