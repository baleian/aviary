apiVersion: v1
kind: Namespace
metadata:
  name: aviary-runtime
  labels:
    # Kubernetes admits no pod here that could get more of its node than a
    # sandbox needs: one that runs as root, takes a capability, or mounts a
    # path of the node. The Supervisor makes no such pod. This holds also for
    # one that something else would make.
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    # Uninstalling the chart must not take the sessions with it: their
    # sandboxes and volumes are here.
    helm.sh/resource-policy: keep
