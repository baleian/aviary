apiVersion: v1
kind: Namespace
metadata:
  name: aviary-runtime
  labels:
    # Kubernetes admits no pod here that could get more of its node than a
    # turn pod needs: one that runs as root, takes a capability, or mounts a
    # path of the node. The Supervisor creates no such pod. This holds also
    # for one that something else would create.
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    # Uninstalling the chart must not take the sessions stored here with it.
    helm.sh/resource-policy: keep
