apiVersion: v1
kind: Namespace
metadata:
  name: aviary-runtime
  labels:
    # Rejects any pod that runs as root, adds capabilities or mounts host
    # paths, whoever creates it.
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    # Uninstalling the chart keeps the sandboxes and volumes of the sessions.
    helm.sh/resource-policy: keep
