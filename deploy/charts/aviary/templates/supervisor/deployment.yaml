apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviary-supervisor
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
spec:
  replicas: {{ .Values.supervisor.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aviary
      app.kubernetes.io/component: supervisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aviary
        app.kubernetes.io/component: supervisor
      {{- with .Values.supervisor.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: aviary-supervisor
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: supervisor
          image: {{ .Values.supervisor.image }}
          env:
            - name: AVIARY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supervisor.database.secretName }}
                  key: {{ .Values.supervisor.database.secretKey }}
            - name: AVIARY_EVENTS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supervisor.events.secretName }}
                  key: {{ .Values.supervisor.events.secretKey }}
            # The keys that secrets are sealed with, and the one that seals.
            - name: AVIARY_ENCRYPTION_KEYS
              value: /etc/aviary/encryption
            - name: AVIARY_ENCRYPTION_KEY
              value: {{ .Values.supervisor.encryption.key | quote }}
            # The hosts at which a project may register a secret store.
            - name: AVIARY_SECRET_STORE_HOSTS
              value: {{ .Values.supervisor.secretStores.allowedHosts | toJson | quote }}
            # For how long a value that was read from a secret store is used.
            - name: AVIARY_SECRET_CACHE_SECONDS
              value: {{ .Values.supervisor.secretStores.cacheSeconds | quote }}
            # The identity provider that tells who sends a request to the
            # API, if the installation has one.
            - name: AVIARY_IDENTITY_PROVIDER
              value: {{ .Values.supervisor.auth.provider | toJson | quote }}
            # The groups of the provider whose members are administrators,
            # and those whose members may use the API.
            - name: AVIARY_ADMIN_GROUPS
              value: {{ .Values.supervisor.auth.admins | toJson | quote }}
            - name: AVIARY_USER_GROUPS
              value: {{ .Values.supervisor.auth.users | toJson | quote }}
            # The sandbox service, in whose sandboxes the sessions run, and
            # what the release had the templates of the harnesses built
            # from: a Supervisor finds the template of a harness by it.
            - name: AVIARY_SANDBOXES_URL
              value: {{ .Values.sandboxes.url | quote }}
            - name: AVIARY_SANDBOXES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sandboxes.apiKey.secretName }}
                  key: {{ .Values.sandboxes.apiKey.secretKey }}
            - name: AVIARY_TEMPLATE_STORE
              value: {{ .Values.sandboxes.templateStore | quote }}
            - name: AVIARY_SANDBOX_IDLE_SECONDS
              value: {{ .Values.sandboxes.idleSeconds | quote }}
            - name: AVIARY_SANDBOX_HOSTS
              value: {{ .Values.sandboxes.allowedHosts | toJson | quote }}
            # Where the egress of the sandbox service reaches the
            # Supervisors, and their certificate.
            - name: AVIARY_RESOLVER_URL
              value: https://aviary-supervisor.{{ .Release.Namespace }}.svc.cluster.local:9443
            - name: AVIARY_RESOLVER_TLS
              value: /etc/aviary/resolver
            - name: AVIARY_SANDBOX_RETENTION_SECONDS
              value: {{ .Values.sandboxes.retentionSeconds | quote }}
            - name: AVIARY_HARNESSES
              value: {{ .Values.runtime.harnesses | toJson | quote }}
            - name: AVIARY_MAX_CONCURRENT_TURNS
              value: {{ .Values.runtime.maxConcurrentTurns | quote }}
            - name: AVIARY_MAX_QUEUED_TURNS
              value: {{ .Values.runtime.maxQueuedTurns | quote }}
            - name: AVIARY_MAX_QUEUE_WAIT_SECONDS
              value: {{ .Values.runtime.maxQueueWaitSeconds | quote }}
            - name: AVIARY_MAX_TOOL_OUTPUT_BYTES
              value: {{ .Values.runtime.maxToolOutputBytes | quote }}
            - name: AVIARY_MAX_STARTUP_SECONDS
              value: {{ .Values.runtime.maxStartupSeconds | quote }}
            - name: AVIARY_MAX_TURN_SECONDS
              value: {{ .Values.runtime.maxTurnSeconds | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: resolver
              containerPort: 9443
            - name: metrics
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.supervisor.resources | nindent 12 }}
          volumeMounts:
            - name: encryption
              mountPath: /etc/aviary/encryption
              readOnly: true
            - name: resolver
              mountPath: /etc/aviary/resolver
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: encryption
          secret:
            secretName: {{ .Values.supervisor.encryption.secretName }}
        - name: resolver
          secret:
            secretName: {{ .Values.supervisor.resolver.secretName }}
