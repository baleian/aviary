{{- range $name, $harness := .Values.runtime.harnesses }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" (toString $harness.image)) }}
{{- fail (printf "runtime.harnesses.%s.image: %q does not name a digest, as registry.example.com/harness@sha256:... does" $name (toString $harness.image)) }}
{{- end }}
{{- end }}
{{- $substrate := .Values.substrate.namespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviary-supervisor
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
spec:
  replicas: {{ .Values.supervisor.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aviary
      app.kubernetes.io/component: supervisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aviary
        app.kubernetes.io/component: supervisor
      {{- with .Values.supervisor.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: aviary-supervisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: supervisor
          image: {{ .Values.supervisor.image }}
          env:
            - name: AVIARY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supervisor.database.secretName }}
                  key: {{ .Values.supervisor.database.secretKey }}
            - name: AVIARY_EVENTS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supervisor.events.secretName }}
                  key: {{ .Values.supervisor.events.secretKey }}
            - name: AVIARY_ENCRYPTION_KEYS
              value: /etc/aviary/encryption
            - name: AVIARY_ENCRYPTION_KEY
              value: {{ .Values.supervisor.encryption.key | quote }}
            - name: AVIARY_SECRET_STORE_HOSTS
              value: {{ .Values.supervisor.secretStores.allowedHosts | toJson | quote }}
            - name: AVIARY_SECRET_CACHE_SECONDS
              value: {{ .Values.supervisor.secretStores.cacheSeconds | int64 | quote }}
            - name: AVIARY_IDENTITY_PROVIDER
              value: {{ .Values.supervisor.auth.provider | toJson | quote }}
            - name: AVIARY_ADMIN_GROUPS
              value: {{ .Values.supervisor.auth.admins | toJson | quote }}
            - name: AVIARY_USER_GROUPS
              value: {{ .Values.supervisor.auth.users | toJson | quote }}
            - name: AVIARY_ALLOWED_ORIGINS
              value: {{ .Values.supervisor.allowedOrigins | toJson | quote }}
            - name: AVIARY_SANDBOX_ATESPACE
              value: {{ .Values.substrate.atespace | quote }}
            - name: AVIARY_SANDBOX_POOL
              value: {{ include "aviary.pool" . | quote }}
            - name: AVIARY_SANDBOX_SNAPSHOT
              value: {{ .Values.sandboxes.snapshot | quote }}
            - name: AVIARY_SANDBOX_HOSTS
              value: {{ .Values.sandboxes.allowedHosts | toJson | quote }}
            - name: AVIARY_SANDBOX_IDLE_SECONDS
              value: {{ .Values.sandboxes.idleSeconds | int64 | quote }}
            - name: AVIARY_SANDBOX_RETENTION_SECONDS
              value: {{ .Values.sandboxes.retentionSeconds | int64 | quote }}
            - name: AVIARY_LLM_LOCALHOST
              value: {{ .Values.sandboxes.localhost | quote }}
            - name: AVIARY_SUBSTRATE_API
              value: api.{{ $substrate }}.svc.cluster.local:443
            - name: AVIARY_SUBSTRATE_AUTHORITY
              value: api.{{ $substrate }}.svc
            - name: AVIARY_SUBSTRATE_TOKEN_FILE
              value: /var/run/substrate/token/token
            - name: AVIARY_SUBSTRATE_CA_FILE
              value: /var/run/substrate/servicedns/trust-bundle.pem
            - name: AVIARY_SUBSTRATE_ROUTER
              value: https://atenet-router.{{ $substrate }}.svc.cluster.local:443
            - name: AVIARY_SUBSTRATE_ROUTER_NAME
              value: atenet-router.{{ $substrate }}.svc
            - name: AVIARY_SUBSTRATE_IDENTITY_FILE
              value: /var/run/substrate/podidentity/credential-bundle.pem
            - name: AVIARY_CREDENTIALS_CERT_FILE
              value: /var/run/substrate/servicedns/credential-bundle.pem
            - name: AVIARY_CREDENTIALS_CLIENT_CA_FILE
              value: /var/run/substrate/podidentity/trust-bundle.pem
            - name: AVIARY_SUBSTRATE_EGRESS_GATEWAY
              value: spiffe://cluster.local/ns/{{ $substrate }}/sa/atenet-egress
            {{- include "aviary.objectStorageEnv" . | nindent 12 }}
            - name: AVIARY_HARNESSES
              value: {{ .Values.runtime.harnesses | toJson | quote }}
            - name: AVIARY_MAX_CONCURRENT_TURNS
              value: {{ .Values.runtime.maxConcurrentTurns | int64 | quote }}
            - name: AVIARY_MAX_QUEUED_TURNS
              value: {{ .Values.runtime.maxQueuedTurns | int64 | quote }}
            - name: AVIARY_MAX_QUEUE_WAIT_SECONDS
              value: {{ .Values.runtime.maxQueueWaitSeconds | int64 | quote }}
            - name: AVIARY_MAX_TOOL_OUTPUT_BYTES
              value: {{ .Values.runtime.maxToolOutputBytes | int64 | quote }}
            - name: AVIARY_MAX_ATTACHMENT_BYTES
              value: {{ .Values.runtime.maxAttachmentBytes | int64 | quote }}
            - name: AVIARY_MAX_ATTACHMENTS
              value: {{ .Values.runtime.maxAttachments | int64 | quote }}
            - name: AVIARY_MAX_STARTUP_SECONDS
              value: {{ .Values.runtime.maxStartupSeconds | int64 | quote }}
            - name: AVIARY_MAX_TURN_SECONDS
              value: {{ .Values.runtime.maxTurnSeconds | int64 | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: credentials
              containerPort: 50051
            - name: metrics
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.supervisor.resources | nindent 12 }}
          volumeMounts:
            - name: encryption
              mountPath: /etc/aviary/encryption
              readOnly: true
            - name: substrate-token
              mountPath: /var/run/substrate/token
              readOnly: true
            - name: servicedns
              mountPath: /var/run/substrate/servicedns
              readOnly: true
            - name: podidentity
              mountPath: /var/run/substrate/podidentity
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: encryption
          secret:
            secretName: {{ .Values.supervisor.encryption.secretName }}
        # The token for the API of Substrate. The kubelet renews it.
        - name: substrate-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.{{ $substrate }}.svc
                  expirationSeconds: 3600
                  path: token
        # The certificate of the Supervisor's Service, which the egress
        # gateway checks, and those that sign the certificates of the API and
        # the router. The kubelet renews them.
        - name: servicedns
          projected:
            sources:
              - podCertificate:
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
        # The certificate of the Supervisor's own identity, which the router
        # checks, and those that sign the egress gateway's.
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
