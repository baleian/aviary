apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviary-supervisor
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
spec:
  replicas: {{ .Values.supervisor.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aviary
      app.kubernetes.io/component: supervisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aviary
        app.kubernetes.io/component: supervisor
      {{- with .Values.supervisor.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: aviary-supervisor
      # A Supervisor that is told to stop first finishes the turns whose
      # runners are connected to it, so it is given a little longer to stop
      # than a turn may run.
      terminationGracePeriodSeconds: {{ add .Values.runtime.maxTurnSeconds 60 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: supervisor
          image: {{ .Values.supervisor.image }}
          env:
            - name: AVIARY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supervisor.database.secretName }}
                  key: {{ .Values.supervisor.database.secretKey }}
            - name: AVIARY_VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supervisor.valkey.secretName }}
                  key: {{ .Values.supervisor.valkey.secretKey }}
            # Where the runners in the turn pods reach this Supervisor.
            - name: AVIARY_GATEWAY_URL
              value: http://aviary-supervisor.{{ .Release.Namespace }}:9090
            - name: AVIARY_RUNNER_IMAGE
              value: {{ .Values.runtime.runnerImage }}
            # Where the harnesses in the turn pods reach the model endpoint: the
            # Egress Proxy, which serves it under the path of llm.url.
            - name: AVIARY_LLM_BASE_URL
              value: http://aviary-egress-proxy.{{ .Release.Namespace }}:8080{{ (urlParse .Values.llm.url).path | trimSuffix "/" }}
            - name: AVIARY_LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            # The proxy that the turn pods use for everything else.
            - name: AVIARY_PROXY_URL
              value: http://aviary-egress-proxy.{{ .Release.Namespace }}:3128
            - name: AVIARY_HARNESSES
              value: {{ .Values.runtime.harnesses | toJson | quote }}
            - name: AVIARY_MAX_CONCURRENT_TURNS
              value: {{ .Values.runtime.maxConcurrentTurns | quote }}
            - name: AVIARY_MAX_QUEUED_TURNS
              value: {{ .Values.runtime.maxQueuedTurns | quote }}
            - name: AVIARY_MAX_QUEUE_WAIT_SECONDS
              value: {{ .Values.runtime.maxQueueWaitSeconds | quote }}
            - name: AVIARY_MAX_TOOL_OUTPUT_BYTES
              value: {{ .Values.runtime.maxToolOutputBytes | quote }}
            - name: AVIARY_MAX_STARTUP_SECONDS
              value: {{ .Values.runtime.maxStartupSeconds | quote }}
            - name: AVIARY_MAX_TURN_SECONDS
              value: {{ .Values.runtime.maxTurnSeconds | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
            - name: authz
              containerPort: 9091
            - name: metrics
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.supervisor.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
