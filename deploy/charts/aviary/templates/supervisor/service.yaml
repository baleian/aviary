apiVersion: v1
kind: Service
metadata:
  name: aviary-supervisor
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
spec:
  selector:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
  ports:
    - name: http
      port: 80
      targetPort: http
    # The secrets of the sandboxes' requests, for the egress gateway of
    # Substrate. The Supervisor's certificate is issued for this Service.
    - name: credentials
      port: 50051
      targetPort: credentials
