apiVersion: v1
kind: Service
metadata:
  name: aviary-supervisor
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
spec:
  selector:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
  ports:
    - name: http
      port: 80
      targetPort: http
    # The runners in the turn pods connect to this port.
    - name: grpc
      port: 9090
      targetPort: grpc
