apiVersion: v1
kind: Service
metadata:
  name: aviary-supervisor
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
spec:
  selector:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
  ports:
    - name: http
      port: 80
      targetPort: http
    # The egress of the sandbox service asks on this port about the requests
    # of the sandboxes.
    - name: resolver
      port: 9443
      targetPort: resolver
    # The Egress Proxy asks on this port which turn a request comes from.
    - name: authz
      port: 9091
      targetPort: authz
