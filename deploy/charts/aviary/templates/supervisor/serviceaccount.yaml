# The identity of the Supervisor at Agent Substrate. It has no permissions in
# the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aviary-supervisor
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: supervisor
  {{- with .Values.supervisor.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
