# Migrates the database schema before the Supervisors of a release start. A
# failure stops the install or upgrade. The Supervisors never change the
# schema themselves, so those of the previous release keep running
# meanwhile.
apiVersion: batch/v1
kind: Job
metadata:
  name: aviary-migrate
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    # Keeps a failed Job, and its log, until the next run.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aviary
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.supervisor.image }}
          args: ["migrate"]
          env:
            - name: AVIARY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supervisor.database.secretName }}
                  key: {{ .Values.supervisor.database.secretKey }}
          resources:
            {{- toYaml .Values.supervisor.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
