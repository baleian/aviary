{{- $inside4 := list }}
{{- $inside6 := list }}
{{- range .Values.egressProxy.insideCIDRs }}
{{- if contains ":" . }}
{{- $inside6 = append $inside6 . }}
{{- else }}
{{- $inside4 = append $inside4 . }}
{{- end }}
{{- end }}
# What the Egress Proxy itself can connect to. The sandboxes reach the
# outside through it, so it must not be a way into the cluster: to the
# database, to other pods, to the node. Inside, it reaches only what the
# rules below name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aviary-egress-proxy
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: egress-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aviary
      app.kubernetes.io/component: egress-proxy
  policyTypes: ["Egress"]
  egress:
    # The Supervisor, which it asks for the turn of a request.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aviary
              app.kubernetes.io/component: supervisor
      ports:
        - {protocol: TCP, port: 9091}
    # The cluster's DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Everything outside.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $inside4 }}
            except: {{ toJson . }}
            {{- end }}
        - ipBlock:
            cidr: ::/0
            {{- with $inside6 }}
            except: {{ toJson . }}
            {{- end }}
    {{- with .Values.egressProxy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
