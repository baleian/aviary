apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviary-egress-proxy
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: egress-proxy
spec:
  replicas: {{ .Values.egressProxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aviary
      app.kubernetes.io/component: egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aviary
        app.kubernetes.io/component: egress-proxy
      annotations:
        # Envoy reads its configuration only at startup.
        checksum/config: {{ include (print $.Template.BasePath "/egress-proxy/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: {{ .Values.egressProxy.image }}
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --disable-hot-restart
            {{- with .Values.egressProxy.concurrency }}
            - --concurrency
            - {{ . | quote }}
            {{- end }}
          # Gives the endpoints time to stop sending new connections here
          # before Envoy stops.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: llm
              containerPort: 8080
            - name: forward
              containerPort: 3128
            - name: metrics
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /healthz
              port: llm
          livenessProbe:
            httpGet:
              path: /healthz
              port: llm
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
          resources:
            {{- toYaml .Values.egressProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: aviary-egress-proxy
