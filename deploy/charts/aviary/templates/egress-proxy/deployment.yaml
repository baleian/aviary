apiVersion: apps/v1
kind: Deployment
metadata:
  name: aviary-egress-proxy
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: egress-proxy
spec:
  replicas: {{ .Values.egressProxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aviary
      app.kubernetes.io/component: egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aviary
        app.kubernetes.io/component: egress-proxy
      annotations:
        # Envoy reads its configuration when it starts.
        checksum/config: {{ include (print $.Template.BasePath "/egress-proxy/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: {{ .Values.egressProxy.image }}
          args: ["--config-path", "/etc/envoy/envoy.yaml", "--disable-hot-restart"]
          # Without the wait, the cluster would still send new connections
          # to a proxy that has stopped.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: llm
              containerPort: 8080
            - name: forward
              containerPort: 3128
            - name: metrics
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /healthz
              port: llm
          livenessProbe:
            httpGet:
              path: /healthz
              port: llm
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
            {{- if .Values.llm.url }}
            - name: llm-api-key
              mountPath: /etc/aviary/llm
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.egressProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: aviary-egress-proxy
        {{- if .Values.llm.url }}
        - name: llm-api-key
          secret:
            secretName: {{ .Values.llm.apiKey.secretName }}
            items:
              - key: {{ .Values.llm.apiKey.secretKey }}
                path: api-key
        {{- end }}
