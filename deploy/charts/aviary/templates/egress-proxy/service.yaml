apiVersion: v1
kind: Service
metadata:
  name: aviary-egress-proxy
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: egress-proxy
spec:
  selector:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: egress-proxy
  ports:
    - name: llm
      port: 8080
      targetPort: llm
    - name: forward
      port: 3128
      targetPort: forward
