{{- $url := urlParse .Values.llm.url }}
{{- if and .Values.llm.url (or (not (has $url.scheme (list "http" "https"))) (not $url.hostname)) }}
{{- fail "llm.url must be a URL that begins with http:// or https://" }}
{{- end }}
{{- if and .Values.llm.url (not .Values.llm.model) }}
{{- fail "llm.model must name the model of the endpoint at llm.url" }}
{{- end }}
{{- $tls := eq $url.scheme "https" }}
{{- $port := include "aviary.llm.port" . | int }}
{{- $path := trimSuffix "/" $url.path }}
{{- $allowAny := has "*" .Values.egressProxy.allowedHosts }}
{{- $hosts := without .Values.egressProxy.allowedHosts "*" }}
{{- range $hosts }}
{{- if not (regexMatch "^[^/@ *]+$" .) }}
{{- fail (printf "egressProxy.allowedHosts takes \"*\" and host names, with a port if it is neither 443 nor 80, and %q is neither" .) }}
{{- end }}
{{- end }}
{{- /* The model endpoint is a host like any other: the list has to allow it. */}}
{{- $llmAllowed := $allowAny }}
{{- range $hosts }}
{{- if or (eq (lower .) (printf "%s:%d" (lower $url.hostname) $port)) (and (eq (lower .) (lower $url.hostname)) (has $port (list 443 80))) }}
{{- $llmAllowed = true }}
{{- end }}
{{- end }}
# The configuration of the Egress Proxy, which is Envoy. Whatever a turn pod
# sends out goes through it, on one of two listeners. On both, the pod sends
# its turn token, Envoy asks the Supervisor which turn the token belongs to,
# and writes a record of the request with that turn. It reads no request or
# response body.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aviary-egress-proxy
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: egress-proxy
data:
  envoy.yaml: |
    node:
      id: aviary-egress-proxy
      cluster: aviary-egress-proxy
    static_resources:
      listeners:
        # The model endpoint. The pod sends its turn token in place of the
        # API key. Envoy puts the API key in the token's place and passes the
        # request on.
        - name: llm
          address:
            socket_address: {address: 0.0.0.0, port_value: 8080}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: llm
                    # A model can be silent for minutes before it answers. A
                    # stream that is silent for as long as a turn may run
                    # belongs to a pod that is gone.
                    stream_idle_timeout: {{ .Values.runtime.maxTurnSeconds }}s
                    # Envoy does not tell the endpoint the address of the pod.
                    skip_xff_append: true
                    generate_request_id: false
                    {{- include "aviary.egress-proxy.access-log" "llm" | nindent 20 }}
                    route_config:
                      virtual_hosts:
                        - name: llm
                          domains: ["*"]
                          # It would say "http", which is how the pod reached
                          # Envoy and not how Envoy reaches the endpoint.
                          request_headers_to_remove: [x-forwarded-proto]
                          routes:
                            {{- if not .Values.llm.url }}
                            - match: {prefix: /}
                              direct_response:
                                status: 503
                                body:
                                  inline_string: "no model endpoint is set: the chart value llm.url is empty\n"
                            {{- else if not $llmAllowed }}
                            - match: {prefix: /}
                              direct_response:
                                status: 403
                                body:
                                  inline_string: {{ printf "the model endpoint is at %s, which egressProxy.allowedHosts does not allow\n" $url.host | quote }}
                            {{- else }}
                            - match:
                                {{- if $path }}
                                path_separated_prefix: {{ $path | quote }}
                                {{- else }}
                                prefix: /
                                {{- end }}
                              route:
                                cluster: llm
                                # The turn's deadline ends a request, not Envoy.
                                timeout: 0s
                                host_rewrite_literal: {{ $url.host | quote }}
                            {{- end }}
                    http_filters:
                      # Answers the kubelet's probe.
                      - name: envoy.filters.http.health_check
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                          pass_through_mode: false
                          headers:
                            - name: ":path"
                              string_match: {exact: /healthz}
                      {{- include "aviary.egress-proxy.ext-authz" . | nindent 22 }}
                      {{- if .Values.llm.url }}
                      # Puts the API key where the pod sent its turn token.
                      - name: envoy.filters.http.credential_injector
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                          overwrite: true
                          credential:
                            name: envoy.http.injected_credentials.generic
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                              header: Authorization
                              header_value_prefix: "Bearer "
                              credential:
                                name: llm-api-key
                                sds_config:
                                  path_config_source:
                                    path: /etc/envoy/llm-api-key.yaml
                                    watched_directory: {path: /etc/aviary/llm}
                      {{- end }}
                      {{- include "aviary.egress-proxy.router" . | nindent 22 }}
        # Everything else, as a forward proxy. The pod has it in its proxy
        # variables, with its turn token as the password. Envoy lets a
        # request through only to the hosts that egressProxy.allowedHosts
        # allows. A request for an HTTPS URL arrives as CONNECT: Envoy sees
        # the host and the port and passes the rest on as it is. Where Envoy
        # itself can connect to is set by its network policy.
        - name: forward
          address:
            socket_address: {address: 0.0.0.0, port_value: 3128}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: forward
                    stream_idle_timeout: {{ .Values.runtime.maxTurnSeconds }}s
                    skip_xff_append: true
                    generate_request_id: false
                    {{- include "aviary.egress-proxy.access-log" "forward" | nindent 20 }}
                    upgrade_configs:
                      - upgrade_type: CONNECT
                    route_config:
                      virtual_hosts:
                        - name: forward
                          domains: ["*"]
                          # The password is for this proxy, not for the host.
                          request_headers_to_remove: [proxy-authorization, x-forwarded-proto]
                          # Tells the Supervisor that the token is the
                          # password of the proxy.
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions: {listener: forward}
                          routes:
                            - match: {connect_matcher: {}}
                              route:
                                cluster: forward
                                timeout: 0s
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match: {prefix: /}
                              route: {cluster: forward, timeout: 0s}
                    http_filters:
                      {{- include "aviary.egress-proxy.ext-authz" . | nindent 22 }}
                      {{- if not $allowAny }}
                      # Refuses a request to a host that is not listed,
                      # before the host's address is looked up.
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            {{- if $hosts }}
                            policies:
                              listed-hosts:
                                principals: [{any: true}]
                                permissions:
                                  {{- include "aviary.egress-proxy.hosts" $hosts | nindent 34 }}
                            {{- end }}
                      {{- end }}
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config: {name: forward, dns_lookup_family: V4_PREFERRED}
                      {{- include "aviary.egress-proxy.router" . | nindent 22 }}
      clusters:
        - name: supervisor
          type: STRICT_DNS
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: supervisor
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: aviary-supervisor.{{ .Release.Namespace }}, port_value: 9091}
        - name: forward
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config: {name: forward, dns_lookup_family: V4_PREFERRED}
        {{- if .Values.llm.url }}
        - name: llm
          type: LOGICAL_DNS
          dns_lookup_family: V4_PREFERRED
          load_assignment:
            cluster_name: llm
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: {{ $url.hostname | quote }}, port_value: {{ $port }}}
          {{- if $tls }}
          # HTTP/2 if the endpoint offers it, so that many turns share a few
          # connections.
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              auto_config: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: {{ $url.hostname | quote }}
              common_tls_context:
                validation_context:
                  trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: {exact: {{ $url.hostname | quote }}}
          {{- end }}
        {{- end }}
  {{- if .Values.llm.url }}
  llm-api-key.yaml: |
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: llm-api-key
        generic_secret:
          secret: {filename: /etc/aviary/llm/api-key}
  {{- end }}
