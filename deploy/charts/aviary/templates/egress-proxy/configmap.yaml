{{- $allowAny := has "*" .Values.egressProxy.allowedHosts }}
{{- $hosts := without .Values.egressProxy.allowedHosts "*" }}
{{- range $hosts }}
{{- if not (regexMatch "^[^/@ *]+$" .) }}
{{- fail (printf "egressProxy.allowedHosts: %q is neither \"*\" nor a host name with an optional port" .) }}
{{- end }}
{{- end }}
# Envoy configuration of the Egress Proxy. All outbound traffic of the
# sandboxes arrives on one of two listeners with the session token of the
# sandbox. Envoy asks the Supervisor which turn a request belongs to and logs
# the request with it. Bodies are not read.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aviary-egress-proxy
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: egress-proxy
data:
  envoy.yaml: |
    node:
      id: aviary-egress-proxy
      cluster: aviary-egress-proxy
    # The admin interface can stop Envoy and dump its configuration, so it
    # listens on an abstract socket that nothing outside the pod can reach,
    # the forward proxy included. The metrics listener exposes its metrics.
    admin:
      address:
        pipe: {path: "@aviary-egress-proxy-admin"}
    static_resources:
      listeners:
        # Model requests. The pod sends its session token in place of an API
        # key. The Supervisor answers with the endpoint and the key of the
        # provider of the turn, and Envoy swaps in the key and forwards the
        # request.
        - name: llm
          address:
            socket_address: {address: 0.0.0.0, port_value: 8080}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: llm
                    # A model can be silent for minutes before it answers. A
                    # stream that is idle for as long as a turn may run has
                    # lost its pod.
                    stream_idle_timeout: {{ .Values.runtime.maxTurnSeconds }}s
                    generate_request_id: false
                    # The Supervisor names the endpoint in these headers. Only
                    # the Supervisor decides where a request goes, so they are
                    # dropped from what the pod sends before routing.
                    early_header_mutation_extensions:
                      - name: envoy.http.early_header_mutation.header_mutation
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
                          mutations:
                            - remove: x-aviary-upstream
                            - remove: x-aviary-upstream-tls
                    {{- if not $allowAny }}
                    # Explains the 403 with which the RBAC filter refuses an
                    # endpoint whose host is not allowed. Envoy replies 403 for
                    # nothing else on this listener.
                    local_reply_config:
                      mappers:
                        - filter:
                            status_code_filter:
                              comparison:
                                op: EQ
                                value: {default_value: 403, runtime_key: none}
                          body:
                            inline_string: "the host of the model endpoint is not in egressProxy.allowedHosts\n"
                    {{- end }}
                    {{- include "aviary.egress-proxy.access-log" "llm" | nindent 20 }}
                    route_config:
                      virtual_hosts:
                        - name: llm
                          domains: ["*"]
                          # x-forwarded-proto would say how the pod reached
                          # Envoy, not how Envoy reaches the endpoint. The
                          # others are for Envoy only.
                          request_headers_to_remove: [x-forwarded-proto, x-aviary-upstream, x-aviary-upstream-tls]
                          routes:
                            # To the endpoint that the Supervisor named.
                            {{- range $secure := list true false }}
                            - match:
                                prefix: /
                                headers:
                                  - name: x-aviary-upstream-tls
                                    string_match: {exact: {{ $secure | quote }}}
                              route:
                                cluster: {{ ternary "model-tls" "model" $secure }}
                                timeout: 0s
                              typed_per_filter_config:
                                envoy.filters.http.dynamic_forward_proxy:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.PerRouteConfig
                                  host_rewrite_header: x-aviary-upstream
                            {{- end }}
                            # Gives every request a route, which ext_authz
                            # needs to run. A request for which the
                            # Supervisor named no endpoint ends here.
                            - match: {prefix: /}
                              direct_response:
                                status: 503
                                body:
                                  inline_string: "no model endpoint for the request\n"
                    http_filters:
                      # Answers the kubelet's probe.
                      - name: envoy.filters.http.health_check
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                          pass_through_mode: false
                          headers:
                            - name: ":path"
                              string_match: {exact: /healthz}
                      {{- include "aviary.egress-proxy.ext-authz" true | nindent 22 }}
                      {{- if not $allowAny }}
                      # Refuses an endpoint whose host is not allowed.
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            policies:
                              listed-hosts:
                                principals: [{any: true}]
                                permissions:
                                  # A request without an endpoint is left
                                  # to the catch-all route.
                                  - not_rule:
                                      header: {name: x-aviary-upstream, present_match: true}
                                  {{- include "aviary.egress-proxy.hosts" (dict "hosts" $hosts "header" "x-aviary-upstream") | nindent 34 }}
                      {{- end }}
                      # Resolves the host that the Supervisor named.
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config: {name: model, dns_lookup_family: V4_PREFERRED}
                      {{- include "aviary.egress-proxy.router" . | nindent 22 }}
        # Everything else, as an HTTP forward proxy that the proxy variables
        # of the pod point to, with the session token as the password. Only
        # the hosts in egressProxy.allowedHosts are let through. HTTPS
        # arrives as CONNECT, so Envoy sees only the host and the port.
        - name: forward
          address:
            socket_address: {address: 0.0.0.0, port_value: 3128}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: forward
                    stream_idle_timeout: {{ .Values.runtime.maxTurnSeconds }}s
                    generate_request_id: false
                    {{- include "aviary.egress-proxy.access-log" "forward" | nindent 20 }}
                    route_config:
                      virtual_hosts:
                        - name: forward
                          domains: ["*"]
                          # The password is for this proxy, not for the host.
                          request_headers_to_remove: [proxy-authorization, x-forwarded-proto]
                          # Tells the Supervisor to take the token from the
                          # proxy credentials.
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions: {listener: forward}
                          routes:
                            - match: {connect_matcher: {}}
                              route:
                                cluster: forward
                                timeout: 0s
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                            - match: {prefix: /}
                              route: {cluster: forward, timeout: 0s}
                    http_filters:
                      {{- include "aviary.egress-proxy.ext-authz" false | nindent 22 }}
                      {{- if not $allowAny }}
                      # Refuses a host that is not allowed before resolving
                      # it.
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            {{- if $hosts }}
                            policies:
                              listed-hosts:
                                principals: [{any: true}]
                                permissions:
                                  {{- include "aviary.egress-proxy.hosts" (dict "hosts" $hosts "header" ":authority") | nindent 34 }}
                            {{- end }}
                      {{- end }}
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config: {name: forward, dns_lookup_family: V4_PREFERRED}
                      {{- include "aviary.egress-proxy.router" . | nindent 22 }}
        # Prometheus metrics.
        - name: metrics
          address:
            socket_address: {address: 0.0.0.0, port_value: 9092}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: metrics
                    route_config:
                      virtual_hosts:
                        - name: metrics
                          domains: ["*"]
                          routes:
                            - match: {path: /metrics}
                              route: {cluster: admin, prefix_rewrite: /stats/prometheus}
                    http_filters:
                      {{- include "aviary.egress-proxy.router" . | nindent 22 }}
      clusters:
        - name: admin
          type: STATIC
          load_assignment:
            cluster_name: admin
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe: {path: "@aviary-egress-proxy-admin"}
        - name: supervisor
          type: STRICT_DNS
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options:
                  # Detects a Supervisor that vanished without closing the
                  # connection, so that Envoy connects to another.
                  connection_keepalive: {interval: 30s, timeout: 10s}
          load_assignment:
            cluster_name: supervisor
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: aviary-supervisor.{{ .Release.Namespace }}, port_value: 9091}
        - name: forward
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config: {name: forward, dns_lookup_family: V4_PREFERRED}
        # The model endpoints that the Supervisor names, without and with
        # TLS.
        - name: model
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config: {name: model, dns_lookup_family: V4_PREFERRED}
        - name: model-tls
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config: {name: model, dns_lookup_family: V4_PREFERRED}
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              # Sends the host name of the endpoint as SNI, and verifies the
              # certificate against it.
              upstream_http_protocol_options: {auto_sni: true, auto_san_validation: true}
              # HTTP/2 when the endpoint offers it, so that turns share
              # connections.
              auto_config: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                validation_context:
                  trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
