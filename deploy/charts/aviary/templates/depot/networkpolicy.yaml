# The objects are files of the sessions, and a depot does not ask who reads
# them. So only the Supervisors can connect to a depot, and a depot connects
# to nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aviary-depot
  labels:
    app.kubernetes.io/name: aviary
    app.kubernetes.io/component: depot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aviary
      app.kubernetes.io/component: depot
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aviary
              app.kubernetes.io/component: supervisor
      ports:
        - {protocol: TCP, port: 8080}
    # The metrics.
    - ports:
        - {protocol: TCP, port: 9092}
