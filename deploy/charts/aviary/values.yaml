supervisor:
  image: aviary-supervisor:dev
  podAnnotations: {}
  database:
    # A secret in the release namespace with the PostgreSQL connection URL,
    # for example postgresql://user:password@host:5432/dbname?sslmode=verify-full
    secretName: aviary-database
    secretKey: uri
  valkey:
    # A secret in the release namespace with the Valkey connection URL, for
    # example valkeys://user:password@host:6379 (valkeys is Valkey over TLS)
    secretName: aviary-valkey
    secretKey: uri

runtime:
  # The most turns that run at once. The turns beyond it wait in the order in
  # which they were accepted.
  maxConcurrentTurns: 50
  # The image that holds the runner. Every turn pod mounts it.
  runnerImage: aviary-runner:dev
  # A secret in the runtime namespace that tells the harnesses how to reach
  # the model server: AVIARY_LLM_BASE_URL, AVIARY_LLM_API_KEY and
  # AVIARY_LLM_MODEL. Every turn pod gets its values as environment variables.
  llmSecretName: aviary-llm
  # The harnesses that agents can use, by the name that an agent is created
  # with.
  harnesses:
    opencode:
      image: aviary-harness-opencode:dev
    codex:
      image: aviary-harness-codex:dev
  # The volume that holds the sessions of the default tenant. Turn pods on
  # any node mount it, so the storage class must offer ReadWriteMany.
  store:
    storageClassName: nfs
    size: 10Gi
