supervisor:
  image: aviary-supervisor:dev
  # Any replica can serve any request.
  replicas: 1
  podAnnotations: {}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    # Leaves room for the output of long turns, which is held in memory
    # until it is stored.
    limits: {memory: 1Gi}
  database:
    # Secret in the release namespace that holds the database URL. The URL
    # scheme selects the plugin, for example
    # postgresql://user:password@host:5432/dbname?sslmode=verify-full
    # or mysql://user:password@host:3306/dbname?tls=true
    secretName: aviary-database
    secretKey: uri
  events:
    # Secret in the release namespace that holds the URL of the event log,
    # which carries the events of running turns between Supervisors. For
    # example valkeys://user:password@host:6379 (valkeys uses TLS).
    secretName: aviary-events
    secretKey: uri
  # Keys that encrypt secrets, such as model provider API keys, before they
  # are stored in the database.
  encryption:
    # Secret in the release namespace. Each entry is a key under a name of
    # your choice: 32 random bytes in base64, as `openssl rand -base64 32`
    # prints them.
    secretName: aviary-encryption
    # The entry that new secrets are encrypted with. To rotate, add an entry
    # and name it here. Keep the old entries: secrets encrypted with them
    # cannot be decrypted without them.
    key: k1
  # Secret stores in which projects keep secrets outside Aviary.
  secretStores:
    # Hosts at which a store may be registered. The Supervisor connects to
    # the stores itself, so list only hosts that it should reach.
    #   "*"        any host
    #   host       the host on the default HTTPS and HTTP ports
    #   host:port  the host on another port, for example
    #              secrets.example.com:8200
    # Empty disables secret stores.
    allowedHosts: []
    # Seconds a value read from a store is cached. 0 reads the store for
    # every model request.
    cacheSeconds: 60
  auth:
    # The identity provider that authenticates API requests. If kind is
    # empty, requests are not authenticated. "oidc" accepts the tokens of an
    # OpenID Connect issuer:
    #   kind: oidc
    #   settings:
    #     issuer: https://login.example.com/realms/main
    #     audience: aviary
    #     claims: {username: email}
    provider:
      kind: ""
      settings: {}
    # Groups, as named in tokens, whose members administer the installation.
    admins: []
    # Groups whose members may use the API, besides the admins. If empty,
    # every authenticated user may.
    users: []
  # Origins whose pages may call the API from a browser, such as that of the
  # web UI if it is served at another address than the API:
  #   https://aviary.example.com
  # "*" is every origin. Pages at the address of the API itself need none.
  allowedOrigins: []

# The state metrics of the installation, such as the number of sandboxes in
# each state. A pod of its own serves them from the database, with the image
# of the Supervisor: the Supervisors report only their own work.
stateMetrics:
  enabled: true
  podAnnotations: {}
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}

# The depot, which keeps the files that messages carry as objects in a
# volume. Its pods run the image of the Supervisor, and only the Supervisors
# can connect to them.
depot:
  # Any replica can serve any request.
  replicas: 1
  podAnnotations: {}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}
  # The volume that holds the objects. Every replica mounts it, and
  # uninstalling the chart keeps it.
  volume:
    size: 30Gi
    # Empty uses the default storage class of the cluster.
    storageClass: ""
    # ReadWriteOnce is a volume that one node mounts, such as a disk: the
    # replicas run on that node together. ReadWriteMany is a volume that
    # many nodes mount at once, such as a network file system or a mounted
    # bucket: the replicas run on any node.
    accessMode: ReadWriteOnce
    # A claim of your own in the namespace of the release, instead of the
    # one that the chart makes. accessMode says how it can be mounted.
    existingClaim: ""

# Agent Substrate, which runs the sandboxes. Its installation names the
# Supervisors as the credential provider aviary.io, at
# aviary-supervisor.<namespace of the release>.svc:50051, lets them manage
# the actors of the atespace and read the workers, and lets their router
# requests in. The namespace of the release has the label
# ate.dev/api-access=true, so that the Supervisors reach the API.
substrate:
  # The namespace of the control plane of Substrate.
  namespace: ate-system
  # The atespace that holds the sandboxes and their templates.
  atespace: aviary

# The workers that hold the sandboxes while they are awake, in the namespace
# aviary-runtime. A worker has room for the sandboxes whose limits fit in its
# resources, and a sandbox that wakes up takes the room of any worker. A
# sandbox that sleeps takes none, so the pool bounds the sessions that run at
# once, not those that exist.
workers:
  replicas: 2
  image: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.1@sha256:fd0c6a46d6c69d485856171e632906e774594bea9d00011a4d7038be3e084a2a
  resources:
    limits: {cpu: "8", memory: 16Gi}

# Each session runs in its own sandbox: an actor of Substrate that runs the
# harness of its agent in gVisor, with a home of its own at /home.
sandboxes:
  # Seconds without a running turn after which a session is put to sleep:
  # its sandbox leaves its worker, and a snapshot keeps it. The next turn
  # wakes it on a worker that has room. 0 disables sleeping.
  idleSeconds: 300
  # Seconds after its last turn after which a session ends: its sandbox is
  # deleted with its snapshot, and its conversation stays in the database.
  # 0 keeps the sandbox until the session is ended.
  retentionSeconds: 0
  # What the snapshot of a sleeping sandbox keeps:
  #   memory   its processes and their memory, its files and its home. A
  #            turn that was running goes on when it wakes.
  #   rootfs   its files and its home. The harness starts again, and resumes
  #            its session.
  #   volumes  its home. The harness starts again, and resumes its session.
  snapshot: memory
  # Hosts that every sandbox may reach, besides the model provider and the
  # MCP servers of its turn, as URLs, whose paths are ignored. A name may be
  # "*" for any host, or begin with "*." for any host of a domain. A URL
  # without a port has that of its scheme. The connections to these hosts
  # pass through Substrate's egress gateway unread.
  allowedHosts: ["https://*", "http://*"]
  # The host that the sandboxes and the Supervisors reach for a model
  # provider or an MCP server whose URL is at localhost or a loopback
  # address, such as http://localhost:11434/v1: a host name. An installation
  # on one machine can name that machine, so that the models that run on it
  # are registered as its users see them. Without it, such a URL is not
  # reached.
  localhost: ""

runtime:
  # Maximum number of turns that run at once. Further turns are queued in
  # the order in which they arrive.
  maxConcurrentTurns: 50
  # Maximum number of queued turns. Beyond it, new messages are refused and
  # the client is told to retry later. 0 means no limit.
  maxQueuedTurns: 500
  # Seconds a turn may stay queued before it expires. 0 means no limit.
  maxQueueWaitSeconds: 120
  # Seconds a turn may take to reach its harness, which includes creating or
  # waking the sandbox, waiting for a worker with room for it and pulling the
  # harness image onto the worker. A turn that takes longer fails. 0 means no
  # limit.
  maxStartupSeconds: 120
  # Seconds a turn may run after it leaves the queue, including the time it
  # waits for approval. A turn that runs longer fails, and what runs in its
  # sandbox is stopped.
  maxTurnSeconds: 1800
  # Maximum bytes of the input or output of a tool call that turn events
  # report. Longer text is truncated in the events; the agent itself gets all
  # of it. 0 means no limit.
  maxToolOutputBytes: 65536
  # Maximum bytes of a file that a message carries, and maximum number of
  # files of one message. 0 files means that messages carry none.
  maxAttachmentBytes: 67108864
  maxAttachments: 10
  # Harnesses that agents can use, by name. The image contains the harness
  # and the runner, and Substrate takes it only by its digest. The limits of
  # CPU and memory are the size of a sandbox of the harness on its worker.
  # A change applies to new sessions, for example
  #   opencode:
  #     image: registry.example.com/aviary-harness-opencode@sha256:...
  #     resources:
  #       limits: {cpu: "2", memory: 2Gi}
  harnesses: {}
