[package]
name = "aviary-runner"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
agent-client-protocol = { version = "5.2.0", features = ["process", "unstable_end_turn_token_usage"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7.20", features = ["compat"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util", "time"] }

# The fake harness of the tests. An example, so that `cargo test` builds it
# before it runs the tests.
[[example]]
name = "fake-harness"
path = "tests/support/fake_harness.rs"
