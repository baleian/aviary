[package]
name = "aviary-runner"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
agent-client-protocol = { version = "5.2.0", features = ["process"] }
futures = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
prost = "0.14.6"
prost-types = "0.14.6"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.9"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"
