[package]
name = "aviary-runner"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
agent-client-protocol = { version = "5.2.0", features = ["process", "unstable_end_turn_token_usage"] }
fastrand = "2.5.0"
futures = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
prost = "0.14.6"
prost-types = "0.14.6"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.9"
uuid = { version = "1.29.2", features = ["v4"] }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"
