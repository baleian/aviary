<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script>
// The theme is set before the first paint, so that a dark page does not flash light.
(function () {
  var chosen = 'system';
  try { chosen = localStorage.getItem('aviary.theme') || 'system'; } catch (e) {}
  var dark = chosen === 'dark' || (chosen === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
