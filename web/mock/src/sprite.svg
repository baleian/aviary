<!-- The mark, in one colour, and the logo, the mark on its tile. The second colour of a mark is --dot. -->
<!-- The mark is the letter A as a rounded chevron, and a wing that crosses it. The wing comes from
     behind the left leg and breaks through the right one, which is cut around it. -->
<symbol id="mark" viewBox="0 0 48 48"><mask id="mf" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"><rect width="48" height="48" fill="#fff"/><path d="M9 39Q18 25 44 22.5Q33 39.5 9 39Z" fill="#000" stroke="#000" stroke-width="3.4" stroke-linejoin="round"/></mask><path d="M24 9 40 40" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" mask="url(#mf)"/><path d="M9 39Q18 25 44 22.5Q33 39.5 9 39Z" fill="var(--dot,currentColor)"/><path d="M8 40 24 9" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></symbol>
<symbol id="logo" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="url(#sky)"/><use href="#mark" x="8.5" y="8" width="30" height="30" style="color:#fff;--dot:#FFC53D"/></symbol>

<symbol id="wing" viewBox="0 0 36 18"><path d="M0 17Q10 2 36 0Q24 18 0 17Z"/></symbol>
