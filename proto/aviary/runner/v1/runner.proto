syntax = "proto3";

// The protocol between the runner in a turn pod and the Supervisor.
package aviary.runner.v1;

import "google/protobuf/struct.proto";

// RunnerService is served by the Supervisor to the runners.
service RunnerService {
  // RunTurn carries one turn. The runner calls it with the token of its turn
  // in the authorization metadata, as "Bearer <token>", and with a UUID that
  // it made up for itself in the aviary-runner metadata. The Supervisor sends
  // Start. The runner sends Started, then the events of the turn, then
  // Finished. While the turn runs the Supervisor may send Cancel, and
  // Approval for an ApprovalRequested.
  //
  // The runner numbers its messages, and the Supervisor answers each with
  // Received. A runner whose call broke calls again, to any Supervisor and
  // with the same UUID, and sends again the messages that Start does not say
  // were recorded. A turn is given back only to the runner that took it.
  rpc RunTurn(stream RunTurnRequest) returns (stream RunTurnResponse);
}

// RunTurnRequest is a message from the runner.
message RunTurnRequest {
  oneof message {
    Started started = 1;
    Finished finished = 2;

    // The events of the turn. The Supervisor passes them on to the clients of
    // its API, each as JSON under the name of its field with a dot for the
    // underscore: message.delta, tool.call and so on.
    MessageDelta message_delta = 3;
    ThoughtDelta thought_delta = 4;
    ToolCall tool_call = 5;
    ToolUpdate tool_update = 6;
    PlanUpdate plan_update = 7;
    ApprovalRequested approval_requested = 9;
    ApprovalResolved approval_resolved = 10;
  }
  // The number of the message among those of the turn, from 1 and without a
  // gap. A message that is sent again keeps its number.
  uint64 seq = 8;
}

// RunTurnResponse is a message from the Supervisor.
message RunTurnResponse {
  oneof message {
    Start start = 1;
    Cancel cancel = 2;
    Received received = 3;
    Approval approval = 4;
  }
}

// Start tells the runner what to run.
message Start {
  // The message that the user sent.
  string text = 1;
  // The harness session to continue. It is unset for the first turn of a
  // session, for which the runner starts a new harness session.
  optional string harness_session_id = 2;
  // What the agent is told before every turn, in the words of whoever set
  // the agent up. It is empty for an agent without instructions.
  string instructions = 3;
  // The number of the runner's last message that is recorded, which is 0 for
  // a runner that calls for the first time. A runner that calls again takes
  // nothing else from Start.
  optional uint64 received = 4;
}

// Received reports that the runner's message with the number is recorded, and
// with it the ones before.
message Received {
  uint64 seq = 1;
}

// Cancel tells the runner to stop the turn. The runner asks the harness to
// stop what it is doing. A harness that does ends the turn with the stop
// reason cancelled, which the runner reports with Finished as for any turn.
message Cancel {}

// Approval is the answer of a person to an ApprovalRequested. The runner
// gives it to the harness, and drops one for a request that waits no longer
// or with an option that the request does not have.
message Approval {
  // The ID of the request.
  string id = 1;
  // The ID of one of its options.
  string option_id = 2;
}

// Started reports that the harness is ready and has been given the message.
message Started {
  // The harness session of the turn, which a later turn continues.
  string harness_session_id = 1;
}

// Finished reports that the harness ended the turn.
message Finished {
  // One of end_turn, max_tokens, max_turn_requests, refusal, cancelled.
  string stop_reason = 1;
  // The token usage of the turn, if the harness reported it.
  Usage usage = 2;
}

// Usage is the token usage of a turn as the harness reports it. It is not a
// measurement: harnesses differ in what they count. One reports the sum of
// the model requests of the turn, another only the last request.
message Usage {
  // The sum of the kinds of tokens.
  int64 total_tokens = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  // The tokens of the model's reasoning.
  optional int64 thought_tokens = 4;
  // The input tokens that were read from, or written to, the model's cache.
  optional int64 cached_read_tokens = 5;
  optional int64 cached_write_tokens = 6;
}

// MessageDelta is the next piece of what the agent says.
message MessageDelta {
  string text = 1;
  // Pieces with the same ID belong to one message.
  optional string message_id = 2;
}

// ThoughtDelta is the next piece of the agent's reasoning.
message ThoughtDelta {
  string text = 1;
  // Pieces with the same ID belong to one thought.
  optional string message_id = 2;
}

// ToolCall reports that the agent started to use a tool.
message ToolCall {
  // Names the call in the updates that follow.
  string id = 1;
  string title = 2;
  // One of read, edit, delete, move, search, execute, think, fetch,
  // switch_mode, other.
  string kind = 3;
  // One of pending, in_progress, completed, failed.
  string status = 4;
  // What the tool was called with, in the harness's own form.
  google.protobuf.Value input = 5;
  // What the tool returned, in the harness's own form.
  google.protobuf.Value output = 6;
  // More about the call, in the harness's own form.
  google.protobuf.Struct meta = 7;
}

// ToolUpdate reports a change to a tool call. Only what changed is set.
message ToolUpdate {
  string id = 1;
  optional string title = 2;
  optional string kind = 3;
  optional string status = 4;
  google.protobuf.Value input = 5;
  google.protobuf.Value output = 6;
  google.protobuf.Struct meta = 7;
}

// PlanUpdate is the agent's plan as it now stands.
message PlanUpdate {
  repeated PlanEntry entries = 1;
}

message PlanEntry {
  string content = 1;
  // One of high, medium, low.
  string priority = 2;
  // One of pending, in_progress, completed.
  string status = 3;
}

// ApprovalRequested reports that the harness asks before it goes on, as a
// harness does that is set up to ask before it acts. The harness waits for
// the answer for as long as the turn runs, and with it the turn. What a
// harness asks about, and when, is up to the harness.
message ApprovalRequested {
  // Names the request in its answer and among the requests of the turn.
  string id = 1;
  // The tool call that the harness asks about, as far as the harness says.
  ToolUpdate tool_call = 2;
  // The answers that the harness takes.
  repeated ApprovalOption options = 3;
}

// ApprovalOption is an answer that a harness takes to its request.
message ApprovalOption {
  string id = 1;
  // One of allow_once, allow_always, reject_once, reject_always. How far
  // "always" reaches is up to the harness.
  string kind = 2;
  // The answer in the harness's words.
  string name = 3;
}

// ApprovalResolved reports that the harness has its answer to a request.
message ApprovalResolved {
  // The ID of the request.
  string id = 1;
  // One of selected, cancelled. selected: the harness was given the option
  // that a person chose. cancelled: the turn was told to stop before anybody
  // answered, as it is when it has run for as long as a turn may.
  string outcome = 2;
  // The option that the harness was given, if it was given one.
  optional string option_id = 3;
}
